name: Build OnePlus EmberHeart Kernel

permissions:
  contents: write
  actions: write

inputs:
  op_config_json:
    description: 'JSON string containing full device config'
    required: true
    type: string
  ksu_type:
    description: 'Select KSU Type'
    required: true
    type: choice
    options:
      - KSUN
      - KSU
  ksun_branch_or_hash:
    description: 'KernelSU Next branch or commit hash (empty = auto)'
    required: false
    type: string
    default: "dev"
  susfs_commit_hash_or_branch:
    description: 'SUSFS branch or commit hash (empty = auto-detect by kernel version)'
    required: false
    type: string
    default: ""
  manifest:
    description: 'Manifest selection (OOS14, OOS15, OOS16, etc.)'
    required: false
    type: string
    default: "OOS16"
  optimize_level:
    description: 'Compiler optimization level (O2 or O3)'
    required: false
    type: string
    default: O2
  kernel_uname:
    description: 'Custom kernel localversion string'
    required: false
    type: string
    default: "EmberHeart"
  backports_release:
    description: 'Backports release version (git branch)'
    required: false
    type: string
    default: backports-6.1.97-1

outputs:
  kernel_version:
    description: 'Full kernel version string'
    value: ${{ steps.save_metadata.outputs.kernel_version }}
  ksu_version:
    description: 'KernelSU version number'
    value: ${{ steps.save_metadata.outputs.ksu_version }}
  ksu_type:
    description: 'KernelSU Variant'
    value: ${{ steps.save_metadata.outputs.ksu_type }}
  susfs_version:
    description: 'SUSFS version string'
    value: ${{ steps.save_metadata.outputs.susfs_version }}
  build_timestamp:
    description: 'Effective kernel build timestamp used in uname -a'
    value: ${{ steps.save_metadata.outputs.build_timestamp }}
  image_sha256:
    description: 'SHA256 hash of kernel Image'
    value: ${{ steps.collect_stats.outputs.image_sha256 }}
  zip_sha256:
    description: 'SHA256 hash of AnyKernel3 Zip'
    value: ${{ steps.create_zip.outputs.zip_sha256 }}
  warnings:
    value: ${{ steps.collect_stats.outputs.warnings_count }}

runs:
  using: composite
  steps:
    - name: Parse op_config_json
      shell: bash
      run: |
        set -euo pipefail
        echo '${{ inputs.op_config_json }}' > /tmp/config.json
        jq -r 'to_entries[] | "OP_\(.key | ascii_upcase)=\(.value)"' /tmp/config.json >> "$GITHUB_ENV"
        echo "Parsed config:"
        jq '.' /tmp/config.json

    - name: Add BBG
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Adding BBG"
        cd "$KERNEL_PLATFORM"
        echo "Adding BBG..."
        if ! wget -q -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash -s main; then
          echo "::warning::BBG setup script failed, continuing anyway"
        fi
        cd "$COMMON"
        ./scripts/config --file arch/arm64/configs/gki_defconfig --enable CONFIG_BBG
        sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig
        echo "BBG LSM added ✅"
        echo "::endgroup::"


        
    - name: Apply Common Optimizations
      shell: bash
      run: |
        cd "$COMMON_KERNEL_FOLDER"
        for patch in \
          "$KERNEL_PATCHES_FOLDER/common/mem_opt_prefetch.patch" \
          "$KERNEL_PATCHES_FOLDER/common/minimise_wakeup_time.patch" \
          "$KERNEL_PATCHES_FOLDER/common/int_sqrt.patch" \
          "$KERNEL_PATCHES_FOLDER/common/force_tcp_nodelay.patch" \
          "$KERNEL_PATCHES_FOLDER/common/reduce_gc_thread_sleep_time.patch" \
          "$KERNEL_PATCHES_FOLDER/common/add_timeout_wakelocks_globally.patch" \
          "$KERNEL_PATCHES_FOLDER/common/f2fs_reduce_congestion.patch" \
          "$KERNEL_PATCHES_FOLDER/common/reduce_freeze_timeout.patch"; do
          patch -p1 --forward < "$patch" || true
        done

    - name: Add Nethunter Inline Configs
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Applying Nethunter configs..."
        cd "$COMMON_KERNEL_FOLDER"

        # Bluetooth configs
        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_BT_HCIBTUSB \
          --enable CONFIG_BT_HCIBTUSB_BCM \
          --enable CONFIG_BT_HCIBTUSB_RTL \
          --enable CONFIG_BT_HCIVHCI \
          --enable CONFIG_BT_HCIBCM203X \
          --enable CONFIG_BT_HCIBPA10X \
          --enable CONFIG_BT_HCIBFUSB

        # Airspy & HackRF
        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_USB_AIRSPY \
          --enable CONFIG_USB_HACKRF

        # CAN
        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_CAN \
          --enable CONFIG_CAN_DEV \
          --enable CONFIG_CAN_CALC_BITTIMING \
          --enable CONFIG_CAN_LEDS \
          --enable CONFIG_CAN_VCAN \
          --enable CONFIG_CAN_GRCAN \
          --enable CONFIG_CAN_XILINXCAN

        # Bosch C_CAN/D_CAN devices
        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_CAN_C_CAN \
          --enable CONFIG_CAN_C_CAN_PLATFORM \
          --enable CONFIG_CAN_C_CAN_PCI

        # Bosch CC770 and Intel AN82527 devices
        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_CAN_CC770 \
          --enable CONFIG_CAN_CC770_ISA \
          --enable CONFIG_CAN_CC770_PLATFORM

        # Bosch M_CAN devices
        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_CAN_M_CAN \
          --enable CONFIG_CAN_M_CAN_PCI \
          --enable CONFIG_CAN_M_CAN_PLATFORM \
          --enable CONFIG_CAN_M_CAN_TCAN4X5X

        # CAN SPI interfaces
        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_CAN_HI311X \
          --enable CONFIG_CAN_MCP251X

        # CAN USB interfaces
        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_CAN_8DEV_USB \
          --enable CONFIG_CAN_EMS_USB \
          --enable CONFIG_CAN_ESD_USB2 \
          --enable CONFIG_CAN_GS_USB \
          --enable CONFIG_CAN_KVASER_USB \
          --enable CONFIG_CAN_PEAK_USB

        # CAN - Networking
        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_NETLINK_DIAG \
          --enable CONFIG_VSOCKETS \
          --enable CONFIG_NET_SCHED \
          --enable CONFIG_NET_EMATCH_CANID

        # USB Serial Converter
        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_USB_SERIAL \
          --enable CONFIG_USB_SERIAL_CONSOLE \
          --enable CONFIG_USB_SERIAL_GENERIC \
          --enable CONFIG_USB_SERIAL_CH341 \
          --enable CONFIG_USB_SERIAL_FTDI_SIO \
          --enable CONFIG_USB_SERIAL_PL2303

        # Other configs
        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_MAC80211_LEDS \
          --enable CONFIG_CAN_SLCAN

    - name: Add TTL Support
      shell: bash
      run: |
        cat >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" <<-EOF
        	CONFIG_IP_NF_TARGET_TTL=y
        	CONFIG_IP6_NF_TARGET_HL=y
        	CONFIG_IP6_NF_MATCH_HL=y
        EOF

    - name: Add IP_SET & IPv6 NAT
      shell: bash
      run: |
        cat >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" <<-EOF
        	CONFIG_IP_SET=y
        	CONFIG_IP_SET_MAX=65534
        	CONFIG_IP_SET_BITMAP_IP=y
        	CONFIG_IP_SET_BITMAP_IPMAC=y
        	CONFIG_IP_SET_BITMAP_PORT=y
        	CONFIG_IP_SET_HASH_IP=y
        	CONFIG_IP_SET_HASH_IPPORT=y
        	CONFIG_IP_SET_HASH_IPPORTIP=y
        	CONFIG_IP_SET_HASH_IPPORTNET=y
        	CONFIG_IP_SET_HASH_IPMAC=y
        	CONFIG_IP_SET_HASH_MAC=y
        	CONFIG_IP_SET_HASH_NET=y
        	CONFIG_IP_SET_HASH_NETPORT=y
        	CONFIG_IP_SET_HASH_NETIFACE=y
        	CONFIG_IP_SET_LIST_SET=y
        	CONFIG_IP6_NF_NAT=y
        	CONFIG_IP6_NF_TARGET_MASQUERADE=y
        EOF

    - name: Add Other configs
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Adding other configs..."
        cd "$COMMON"

        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_LRU_GEN_ENABLED

        # Add for Droidspaces support
        echo "Applying patch to enable SYSVIPC without breaking ABI"
        case "$BRANCH" in
          oneplus/sm8850|oneplus/sm8845)
            if patch -R -p1 -s -f --dry-run < "$WILD_KERNEL_PATCHES/common/droidspaces/fix_sysvipc_kabi_a16-6.12.patch" >/dev/null 2>&1; then
              echo "[INFO] Patch already applied. Skipping."
            else
              patch -p1 --forward < "$WILD_KERNEL_PATCHES/common/droidspaces/fix_sysvipc_kabi_a16-6.12.patch"
            fi
            ;;
          oneplus/sm8550|oneplus/sm7550)
            if patch -R -p1 -s -f --dry-run < "$WILD_KERNEL_PATCHES/common/droidspaces/fix_sysvipc_kabi_1_2_3.patch" >/dev/null 2>&1; then
              echo "[INFO] Patch already applied. Skipping."
            else
              patch -p1 --forward < "$WILD_KERNEL_PATCHES/common/droidspaces/fix_sysvipc_kabi_1_2_3.patch"
            fi
            ;;
          oneplus/sm8450|oneplus/sm8475|oneplus/mt6895|oneplus/mt6983|oneplus/mt6789)
            if [ "$ANDROID_RELEASE" = "android12" ] && [ "$KERNEL_VER" = "5.10" ]; then
              if patch -R -p1 -s -f --dry-run < "$WILD_KERNEL_PATCHES/common/droidspaces/fix_sysvipc_kabi_bypass_a16-6.12_below.patch" >/dev/null 2>&1; then
                echo "[INFO] Patch already applied. Skipping."
              else
                patch -p1 --forward < "$WILD_KERNEL_PATCHES/common/droidspaces/fix_sysvipc_kabi_bypass_a16-6.12_below.patch"
              fi

              if patch -R -p1 -s -f --dry-run < "$WILD_KERNEL_PATCHES/common/droidspaces/fix_abi_padding_for_posix_mqueue.patch" >/dev/null 2>&1; then
                echo "[INFO] Patch already applied. Skipping."
              else
                patch -p1 --forward < "$WILD_KERNEL_PATCHES/common/droidspaces/fix_abi_padding_for_posix_mqueue.patch"
              fi
            else

              if patch -R -p1 -s -f --dry-run < "$WILD_KERNEL_PATCHES/common/droidspaces/fix_sysvipc_kabi_6_7_8.patch" >/dev/null 2>&1; then
                echo "[INFO] Patch already applied. Skipping."
              else
                patch -p1 --forward < "$WILD_KERNEL_PATCHES/common/droidspaces/fix_sysvipc_kabi_6_7_8.patch"
              fi

            fi
            ;;
          los/sm8550)
            if patch -R -p1 -s -f --dry-run < "$WILD_KERNEL_PATCHES/common/droidspaces/fix_sysvipc_kabi_3_4_5.patch" >/dev/null 2>&1; then
                echo "[INFO] Patch already applied. Skipping."
            else
                patch -p1 --forward < "$WILD_KERNEL_PATCHES/common/droidspaces/fix_sysvipc_kabi_3_4_5.patch"
            fi
            ;;
          *)
            if patch -R -p1 -s -f --dry-run < "$WILD_KERNEL_PATCHES/common/droidspaces/fix_sysvipc_kabi_6_7_8.patch" >/dev/null 2>&1; then
              echo "[INFO] Patch already applied. Skipping."
            else
              patch -p1 --forward < "$WILD_KERNEL_PATCHES/common/droidspaces/fix_sysvipc_kabi_6_7_8.patch"
            fi
            ;;
        esac

        ./scripts/config --file arch/arm64/configs/gki_defconfig \
                  --enable CONFIG_SYSVIPC \
                  --enable CONFIG_DEVTMPFS \
                  --enable CONFIG_PID_NS \
                  --enable CONFIG_POSIX_MQUEUE \
                  --enable CONFIG_NETFILTER_XT_MATCH_ADDRTYPE \
                  --enable CONFIG_NETFILTER_XT_SET \
                  --enable CONFIG_NETFILTER_XT_TARGET_REJECT \
                  --enable CONFIG_NETFILTER_XT_TARGET_LOG \
                  --enable CONFIG_NETFILTER_XT_MATCH_RECENT

        echo "Other configs added ✅"
        echo "::endgroup::"

        
    - name: Add BBR
      shell: bash
      run: |
        cat >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" <<-EOF
        	CONFIG_TCP_CONG_ADVANCED=y
        	CONFIG_TCP_CONG_BBR=y
        	CONFIG_NET_SCH_FQ=y
        	CONFIG_NET_SCH_FQ_CODEL=y
        EOF

    - name: Add Build Configs & MAC80211=m
      shell: bash
      run: |
        cd "$COMMON_KERNEL_FOLDER"
        cat >> arch/arm64/configs/gki_defconfig <<-EOF
        	CONFIG_LTO_CLANG_THIN=y
        	CONFIG_LTO_CLANG=y
        	CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
        	CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3=n
        	CONFIG_OPTIMIZE_INLINING=y
        	CONFIG_FRAME_WARN=0
        	CONFIG_TRACEPOINTS=y
        EOF
        ./scripts/config --file arch/arm64/configs/gki_defconfig --enable CONFIG_MAC80211

    - name: Save Build Metadata
      id: save_metadata
      shell: bash
      run: |
        cd "$ARTIFACTS_FOLDER"
        echo "kernel_version=$KERNEL_FULL_VER" >> "$GITHUB_OUTPUT"
        echo "ksu_version=$KSUVER" >> "$GITHUB_OUTPUT"
        echo "susfs_version=$SUSVER" >> "$GITHUB_OUTPUT"

    - name: Detect Clang
      shell: bash
      run: |
        for base in "$KERNEL_PLATFORM_FOLDER/prebuilts" "$KERNEL_PLATFORM_FOLDER/prebuilts-master"; do
          [ -d "$base/clang/host/linux-x86" ] || continue
          latest=$(ls -d "$base/clang/host/linux-x86/clang-r"* 2>/dev/null | sort -V | tail -n1 || true)
          if [ -n "$latest" ] && [ -x "$latest/bin/clang" ]; then
            CLANG_BIN="$latest/bin"
            break
          fi
        done
        [ -z "${CLANG_BIN:-}" ] && { echo "No clang found"; exit 1; }
        echo "CLANG_BIN_PATH=$CLANG_BIN" >> "$GITHUB_ENV"

    - name: Build Kernel
      shell: bash
      run: |
        export LLVM=1 LLVM_IAS=1 ARCH=arm64 SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu- LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
        export PATH="/usr/lib/ccache:${CLANG_BIN_PATH}:$PATH"
        export CC="ccache clang" HOSTCC="ccache clang" HOSTCXX="ccache clang++"
        cd "$COMMON_KERNEL_FOLDER"
        : > .scmversion
        OUT=out
        mkdir -p "$OUT"
        make O="$OUT" gki_defconfig
        ./scripts/config --file "$OUT/.config" --set-str LOCALVERSION "-${ANDROID_VER}-${{ inputs.kernel_uname }}"
        make O="$OUT" olddefconfig
        make -j$(nproc --all) O="$OUT" modules_prepare
        make -j$(nproc --all) O="$OUT" Image || { echo "Kernel build failed"; exit 1; }
    
    - name: Build Linux Headers .deb Package
      if: success()
      shell: bash
      run: |
        set -euo pipefail
        cd "$COMMON_KERNEL_FOLDER"
        OUT=out
        KERNELRELEASE=$(make O="$OUT" -s kernelrelease)
        HEADERS_DIR="$GITHUB_WORKSPACE/linux-headers-$KERNELRELEASE"
        rm -rf "$HEADERS_DIR"
        mkdir -p "$HEADERS_DIR/DEBIAN"
        mkdir -p "$HEADERS_DIR/usr/src/linux-headers-$KERNELRELEASE"
    
        # Install headers
        make O="$OUT" ARCH=arm64 headers_install INSTALL_HDR_PATH="$HEADERS_DIR/usr"
    
        # Copy .config and Module.symvers (if exists)
        cp "$OUT/.config" "$HEADERS_DIR/usr/src/linux-headers-$KERNELRELEASE/.config"
        if [ -f "$OUT/Module.symvers" ]; then
          cp "$OUT/Module.symvers" "$HEADERS_DIR/usr/src/linux-headers-$KERNELRELEASE/Module.symvers"
        else
          echo "::warning::Module.symvers not found; headers package will lack symbol version info"
        fi
    
        # Create control file
        cat > "$HEADERS_DIR/DEBIAN/control" <<-EOF
        Package: linux-headers-$KERNELRELEASE
        Version: $KERNELRELEASE
        Architecture: arm64
        Maintainer: $BUILD_USER <$BUILD_USER@$BUILD_HOST>
        Description: Linux kernel headers for $KERNELRELEASE
         This package provides kernel header files for version $KERNELRELEASE,
         useful for building external kernel modules like DKMS or manual compilations.
        EOF
    
        # Build .deb
        cd "$GITHUB_WORKSPACE"
        dpkg-deb --build "linux-headers-$KERNELRELEASE"
        mv "linux-headers-${KERNELRELEASE}.deb" "$ARTIFACTS_FOLDER/"
        echo "✅ Headers .deb created: $ARTIFACTS_FOLDER/linux-headers-${KERNELRELEASE}.deb"

    - name: Build Backports 6.1.97-1 (Full Wi-Fi driver set)
      shell: bash
      run: |
        set -euo pipefail
        RELEASE="${{ inputs.backports_release }}"
        URL="https://cdn.kernel.org/pub/linux/kernel/projects/backports/stable/v6.1.97/${RELEASE}.tar.xz"
        KERNEL_BUILD="$GITHUB_WORKSPACE/$CONFIG/kernel_platform/common/out"
    
        if [ -n "${CLANG_BIN_PATH:-}" ] && [ -x "${CLANG_BIN_PATH}/clang" ]; then
          export PATH="${CLANG_BIN_PATH}:$PATH"
        fi
        export PATH="/usr/lib/ccache:$PATH"
    
        MAKE_FLAGS=(
          LLVM=1 LLVM_IAS=1 ARCH=arm64 SUBARCH=arm64
          CLANG_TRIPLE=aarch64-linux-gnu-
          CROSS_COMPILE=aarch64-linux-gnu-
          CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          LD=ld.lld HOSTLD=ld.lld AR=llvm-ar NM=llvm-nm
          OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump
          DEPMOD=depmod DTC=dtc STRIP=llvm-strip
          HOSTCC=clang HOSTCXX=clang++ CC=clang
        )
    
        cd "$GITHUB_WORKSPACE"
        wget -q -O backports.tar.xz "$URL"
        tar -xf backports.tar.xz
        rm -rf backports-stable
        mv "$RELEASE" backports-stable
        cd backports-stable
    
        # Patch CFI macro
        FILE="backport-include/linux/module.h"
        sed -i 's/__CFI_ADDRESSABLE(init_module, __initdata)/__CFI_ADDRESSABLE(init_module)/g' "$FILE"
        sed -i 's/__CFI_ADDRESSABLE(cleanup_module, __exitdata)/__CFI_ADDRESSABLE(cleanup_module)/g' "$FILE"
    
        make "${MAKE_FLAGS[@]}" KLIB="$KERNEL_BUILD" KLIB_BUILD="$KERNEL_BUILD" allnoconfig
    
        # Full CPTCFG list via printf
        printf '%s\n' \
          'CPTCFG_CFG80211=m' \
          'CPTCFG_CFG80211_DEFAULT_PS=y' \
          'CPTCFG_CFG80211_DEBUGFS=y' \
          'CPTCFG_CFG80211_WEXT=y' \
          'CPTCFG_MAC80211=m' \
          'CPTCFG_MAC80211_LEDS=y' \
          'CPTCFG_MAC80211_MESH=y' \
          'CPTCFG_MAC80211_DEBUGFS=y' \
          'CPTCFG_MAC80211_MESSAGE_TRACING=y' \
          'CPTCFG_WLAN=y' \
          'CPTCFG_NL80211_TESTMODE=y' \
          'CPTCFG_USB=y' \
          'CPTCFG_PCI=y' \
          'CPTCFG_WLAN_VENDOR_MEDIATEK=y' \
          'CPTCFG_MT76_CORE=m' \
          'CPTCFG_MT76_USB=m' \
          'CPTCFG_MT76_PCI=m' \
          'CPTCFG_MT76_SDIO=m' \
          'CPTCFG_MT76_CONNAC_LIB=m' \
          'CPTCFG_MT76x0_COMMON=m' \
          'CPTCFG_MT76x0U=m' \
          'CPTCFG_MT76x0E=m' \
          'CPTCFG_MT76x2_COMMON=m' \
          'CPTCFG_MT76x2U=m' \
          'CPTCFG_MT76x2E=m' \
          'CPTCFG_MT7601U=m' \
          'CPTCFG_MT7603E=m' \
          'CPTCFG_MT7615_COMMON=m' \
          'CPTCFG_MT7615E=m' \
          'CPTCFG_MT7663_USB_SDIO_COMMON=m' \
          'CPTCFG_MT7663U=m' \
          'CPTCFG_MT7663S=m' \
          'CPTCFG_MT7915E=m' \
          'CPTCFG_MT7921_COMMON=m' \
          'CPTCFG_MT7921U=m' \
          'CPTCFG_MT7921S=m' \
          'CPTCFG_MT7921E=m' \
          'CPTCFG_MT7925_COMMON=m' \
          'CPTCFG_MT7925U=m' \
          'CPTCFG_MT7925E=m' \
          'CPTCFG_MT7996E=m' \
          'CPTCFG_WLAN_VENDOR_RALINK=y' \
          'CPTCFG_RT2X00=m' \
          'CPTCFG_RT2X00_LIB=m' \
          'CPTCFG_RT2X00_LIB_FIRMWARE=y' \
          'CPTCFG_RT2X00_USB=m' \
          'CPTCFG_RT2X00_PCI=m' \
          'CPTCFG_RT2800LIB=m' \
          'CPTCFG_RT2800USB=m' \
          'CPTCFG_RT2800USB_RT33XX=y' \
          'CPTCFG_RT2800USB_RT35XX=y' \
          'CPTCFG_RT2800USB_RT3573=y' \
          'CPTCFG_RT2800USB_RT53XX=y' \
          'CPTCFG_RT2800USB_RT55XX=y' \
          'CPTCFG_RT2800USB_UNKNOWN=y' \
          'CPTCFG_RT2500USB=m' \
          'CPTCFG_RT73USB=m' \
          'CPTCFG_RT2400PCI=m' \
          'CPTCFG_RT2500PCI=m' \
          'CPTCFG_RT2800PCI=m' \
          'CPTCFG_RT2800PCI_RT33XX=y' \
          'CPTCFG_RT2800PCI_RT35XX=y' \
          'CPTCFG_RT2800PCI_RT53XX=y' \
          'CPTCFG_RT2800PCI_RT3290=y' \
          'CPTCFG_WLAN_VENDOR_ATH=y' \
          'CPTCFG_ATH_COMMON=m' \
          'CPTCFG_ATH_CARDS=m' \
          'CPTCFG_ATH5K=m' \
          'CPTCFG_ATH9K=m' \
          'CPTCFG_ATH9K_HW=m' \
          'CPTCFG_ATH9K_COMMON=m' \
          'CPTCFG_ATH9K_COMMON_DEBUG=y' \
          'CPTCFG_ATH9K_DEBUGFS=y' \
          'CPTCFG_ATH9K_HTC=m' \
          'CPTCFG_ATH9K_HTC_DEBUGFS=y' \
          'CPTCFG_ATH6KL=m' \
          'CPTCFG_ATH6KL_USB=m' \
          'CPTCFG_ATH6KL_SDIO=m' \
          'CPTCFG_CARL9170=m' \
          'CPTCFG_AR5523=m' \
          'CPTCFG_WIL6210=m' \
          'CPTCFG_ATH10K=m' \
          'CPTCFG_ATH10K_PCI=m' \
          'CPTCFG_ATH10K_SDIO=m' \
          'CPTCFG_ATH10K_USB=m' \
          'CPTCFG_ATH10K_DEBUG=y' \
          'CPTCFG_ATH10K_DEBUGFS=y' \
          'CPTCFG_ATH11K=m' \
          'CPTCFG_ATH11K_PCI=m' \
          'CPTCFG_ATH11K_DEBUG=y' \
          'CPTCFG_ATH11K_DEBUGFS=y' \
          'CPTCFG_WCN36XX=m' \
          'CPTCFG_WCN36XX_DEBUGFS=y' \
          'CPTCFG_WLAN_VENDOR_ZYDAS=y' \
          'CPTCFG_ZD1211RW=m' \
          'CPTCFG_MHI_BUS=m' \
          'CPTCFG_QRTR=m' \
          'CPTCFG_QRTR_MHI=m' \
          >> .config
    
        make "${MAKE_FLAGS[@]}" KLIB="$KERNEL_BUILD" KLIB_BUILD="$KERNEL_BUILD" olddefconfig
    
        make -j$(nproc --all) "${MAKE_FLAGS[@]}" \
          KLIB="$KERNEL_BUILD" KLIB_BUILD="$KERNEL_BUILD" \
          V=1 2>&1 | tee ../backports-build.log
    
        KO_COUNT=$(find . -name '*.ko' | wc -l)
        echo "Backports built .ko count: $KO_COUNT"
        [ "$KO_COUNT" -gt 0 ] || exit 1
    
        mkdir -p ../backports-artifacts
        find . -name '*.ko' -exec cp --parents {} ../backports-artifacts/ \;
        cp .config ../backports-artifacts/backports.config
        cp ../backports-build.log ../backports-artifacts/


    - name: Archive backports modules (flat)
      if: success()
      shell: bash
      run: |
        set -euo pipefail
        if [ ! -d "$GITHUB_WORKSPACE/backports-artifacts" ]; then
          echo "Backports artifacts not found, skipping archive."
          exit 0
        fi
        mkdir -p /tmp/backports-flat
        find "$GITHUB_WORKSPACE/backports-artifacts" -name '*.ko' -exec cp {} /tmp/backports-flat/ \;
        cd /tmp/backports-flat
        zip -r "$ARTIFACTS_FOLDER/backports-all-modules.zip" .
        echo "Flat archive created: $ARTIFACTS_FOLDER/backports-all-modules.zip"
        
    - name: Create AnyKernel3 ZIP
      id: create_zip
      shell: bash
      run: |
        cp "$COMMON_KERNEL_FOLDER/out/arch/arm64/boot/Image" "$AK3_FOLDER/"
        cp "$ARTIFACTS_FOLDER/${OP_MODEL}.txt" "$AK3_FOLDER/"
        cd "$AK3_FOLDER"
        ZIP_NAME="AK3_${OP_MODEL}_${KERNEL_FULL_VER}_KSUN_${KSUVER}_SuSFS_${SUSVER}.zip"
        zip -r "$ZIP_NAME" . -x "*.git*"
        mv "$ZIP_NAME" "$ARTIFACTS_FOLDER/"
        ZIP_SHA256=$(sha256sum "$ARTIFACTS_FOLDER/$ZIP_NAME" | awk '{print $1}')
        echo "zip_sha256=$ZIP_SHA256" >> "$GITHUB_OUTPUT"
        echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

    - name: Collect Build Stats
      id: collect_stats
      shell: bash
      run: |
        IMG="$COMMON_KERNEL_FOLDER/out/arch/arm64/boot/Image"
        IMG_SHA256=$(sha256sum "$IMG" | awk '{print $1}')
        WARNINGS_COUNT=$(grep -ci warning "$COMMON_KERNEL_FOLDER/build.log" 2>/dev/null || echo 0)
        echo "image_sha256=$IMG_SHA256" >> "$GITHUB_OUTPUT"
        echo "warnings_count=$WARNINGS_COUNT" >> "$GITHUB_OUTPUT"
    
    - name: Create Boot Image
      if: success() && steps.create_zip.conclusion == 'success'
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Creating boot image..."
        CONFIG_DIR="$GITHUB_WORKSPACE/$CONFIG"
        IMAGE="$CONFIG_DIR/kernel_platform/common/out/arch/arm64/boot/Image"

        cd "$GITHUB_WORKSPACE"
        mkdir -p boot
        python3 -m pip install --user gdown
        python3 -m gdown 1DgD6wTSZ-r4zklYzA_x7GYcjwfA9WV0x
        unzip boot.zip
        wget https://github.com/magojohnji/magiskboot-linux/raw/refs/heads/main/x86_64/magiskboot

        BOOT=$(ls | grep -E '*.img')
        MAGISKBOOT="./magiskboot"

        chmod +x $MAGISKBOOT

        echo -n "Unpacking boot image..."
        $MAGISKBOOT unpack $BOOT
        echo -n "Adding kernel to boot image..."
        mv -f $IMAGE kernel
        echo -n "Repacking boot image..."
        $MAGISKBOOT repack $BOOT

        mv -f new-boot.img EmberHeart_boot.img
        cp EmberHeart_boot.img "$CONFIG_DIR/artifacts/"

        echo "Boot image created ✅"
        echo "::endgroup::"

    - name: Upload Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
       name: kernel-${{ env.CONFIG }}
       path: |
        ${{ env.ARTIFACTS_FOLDER }}/AK3_*.zip
        ${{ env.ARTIFACTS_FOLDER }}/backports-all-modules.zip
        ${{ env.ARTIFACTS_FOLDER }}/linux-headers-*.deb


