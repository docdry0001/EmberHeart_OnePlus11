    - name: Detect Clang
      shell: bash
      run: |
        for base in "$KERNEL_PLATFORM_FOLDER/prebuilts" "$KERNEL_PLATFORM_FOLDER/prebuilts-master"; do
          [ -d "$base/clang/host/linux-x86" ] || continue
          latest=$(ls -d "$base/clang/host/linux-x86/clang-r"* 2>/dev/null | sort -V | tail -n1 || true)
          if [ -n "$latest" ] && [ -x "$latest/bin/clang" ]; then
            CLANG_BIN="$latest/bin"
            break
          fi
        done
        [ -z "${CLANG_BIN:-}" ] && { echo "No clang found"; exit 1; }
        echo "CLANG_BIN_PATH=$CLANG_BIN" >> "$GITHUB_ENV"

    - name: Build Kernel
      shell: bash
      run: |
        export LLVM=1 LLVM_IAS=1 ARCH=arm64 SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu- LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
        export PATH="/usr/lib/ccache:${CLANG_BIN_PATH}:$PATH"
        export CC="ccache clang" HOSTCC="ccache clang" HOSTCXX="ccache clang++"
        cd "$COMMON_KERNEL_FOLDER"
        : > .scmversion
        OUT=out
        mkdir -p "$OUT"
        make O="$OUT" gki_defconfig
        ./scripts/config --file "$OUT/.config" --set-str LOCALVERSION "-${ANDROID_VER}-${{ inputs.kernel_uname }}"
        make O="$OUT" olddefconfig
        make -j$(nproc --all) O="$OUT" modules_prepare
        make -j$(nproc --all) O="$OUT" Image || { echo "Kernel build failed"; exit 1; }
    
    - name: Build Linux Headers .deb Package
      if: success()
      shell: bash
      run: |
        set -euo pipefail
        cd "$COMMON_KERNEL_FOLDER"
        OUT=out
        KERNELRELEASE=$(make O="$OUT" -s kernelrelease)
        HEADERS_DIR="$GITHUB_WORKSPACE/linux-headers-$KERNELRELEASE"
        rm -rf "$HEADERS_DIR"
        mkdir -p "$HEADERS_DIR/DEBIAN"
        mkdir -p "$HEADERS_DIR/usr/src/linux-headers-$KERNELRELEASE"
    
        # Install headers
        make O="$OUT" ARCH=arm64 headers_install INSTALL_HDR_PATH="$HEADERS_DIR/usr"
    
        # Copy .config and Module.symvers (if exists)
        cp "$OUT/.config" "$HEADERS_DIR/usr/src/linux-headers-$KERNELRELEASE/.config"
        if [ -f "$OUT/Module.symvers" ]; then
          cp "$OUT/Module.symvers" "$HEADERS_DIR/usr/src/linux-headers-$KERNELRELEASE/Module.symvers"
        else
          echo "::warning::Module.symvers not found; headers package will lack symbol version info"
        fi
    
        # Create control file
        cat > "$HEADERS_DIR/DEBIAN/control" <<-EOF
        Package: linux-headers-$KERNELRELEASE
        Version: $KERNELRELEASE
        Architecture: arm64
        Maintainer: $BUILD_USER <$BUILD_USER@$BUILD_HOST>
        Description: Linux kernel headers for $KERNELRELEASE
         This package provides kernel header files for version $KERNELRELEASE,
         useful for building external kernel modules like DKMS or manual compilations.
        EOF
    
        # Build .deb
        cd "$GITHUB_WORKSPACE"
        dpkg-deb --build "linux-headers-$KERNELRELEASE"
        mv "linux-headers-${KERNELRELEASE}.deb" "$ARTIFACTS_FOLDER/"
        echo "✅ Headers .deb created: $ARTIFACTS_FOLDER/linux-headers-${KERNELRELEASE}.deb"

    - name: Build Backports 6.1.97-1 (Full Wi-Fi driver set)
      shell: bash
      run: |
        set -euo pipefail
        RELEASE="${{ inputs.backports_release }}"
        URL="https://cdn.kernel.org/pub/linux/kernel/projects/backports/stable/v6.1.97/${RELEASE}.tar.xz"
        KERNEL_BUILD="$GITHUB_WORKSPACE/$CONFIG/kernel_platform/common/out"
    
        if [ -n "${CLANG_BIN_PATH:-}" ] && [ -x "${CLANG_BIN_PATH}/clang" ]; then
          export PATH="${CLANG_BIN_PATH}:$PATH"
        fi
        export PATH="/usr/lib/ccache:$PATH"
    
        MAKE_FLAGS=(
          LLVM=1 LLVM_IAS=1 ARCH=arm64 SUBARCH=arm64
          CLANG_TRIPLE=aarch64-linux-gnu-
          CROSS_COMPILE=aarch64-linux-gnu-
          CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          LD=ld.lld HOSTLD=ld.lld AR=llvm-ar NM=llvm-nm
          OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump
          DEPMOD=depmod DTC=dtc STRIP=llvm-strip
          HOSTCC=clang HOSTCXX=clang++ CC=clang
        )
    
        cd "$GITHUB_WORKSPACE"
        wget -q -O backports.tar.xz "$URL"
        tar -xf backports.tar.xz
        rm -rf backports-stable
        mv "$RELEASE" backports-stable
        cd backports-stable
    
        # Patch CFI macro
        FILE="backport-include/linux/module.h"
        sed -i 's/__CFI_ADDRESSABLE(init_module, __initdata)/__CFI_ADDRESSABLE(init_module)/g' "$FILE"
        sed -i 's/__CFI_ADDRESSABLE(cleanup_module, __exitdata)/__CFI_ADDRESSABLE(cleanup_module)/g' "$FILE"
    
        make "${MAKE_FLAGS[@]}" KLIB="$KERNEL_BUILD" KLIB_BUILD="$KERNEL_BUILD" allnoconfig
    
        # Full CPTCFG list via printf
        printf '%s\n' \
          'CPTCFG_CFG80211=m' \
          'CPTCFG_CFG80211_DEFAULT_PS=y' \
          'CPTCFG_CFG80211_DEBUGFS=y' \
          'CPTCFG_CFG80211_WEXT=y' \
          'CPTCFG_MAC80211=m' \
          'CPTCFG_MAC80211_LEDS=y' \
          'CPTCFG_MAC80211_MESH=y' \
          'CPTCFG_MAC80211_DEBUGFS=y' \
          'CPTCFG_MAC80211_MESSAGE_TRACING=y' \
          'CPTCFG_WLAN=y' \
          'CPTCFG_NL80211_TESTMODE=y' \
          'CPTCFG_USB=y' \
          'CPTCFG_PCI=y' \
          'CPTCFG_WLAN_VENDOR_MEDIATEK=y' \
          'CPTCFG_MT76_CORE=m' \
          'CPTCFG_MT76_USB=m' \
          'CPTCFG_MT76_PCI=m' \
          'CPTCFG_MT76_SDIO=m' \
          'CPTCFG_MT76_CONNAC_LIB=m' \
          'CPTCFG_MT76x0_COMMON=m' \
          'CPTCFG_MT76x0U=m' \
          'CPTCFG_MT76x0E=m' \
          'CPTCFG_MT76x2_COMMON=m' \
          'CPTCFG_MT76x2U=m' \
          'CPTCFG_MT76x2E=m' \
          'CPTCFG_MT7601U=m' \
          'CPTCFG_MT7603E=m' \
          'CPTCFG_MT7615_COMMON=m' \
          'CPTCFG_MT7615E=m' \
          'CPTCFG_MT7663_USB_SDIO_COMMON=m' \
          'CPTCFG_MT7663U=m' \
          'CPTCFG_MT7663S=m' \
          'CPTCFG_MT7915E=m' \
          'CPTCFG_MT7921_COMMON=m' \
          'CPTCFG_MT7921U=m' \
          'CPTCFG_MT7921S=m' \
          'CPTCFG_MT7921E=m' \
          'CPTCFG_MT7925_COMMON=m' \
          'CPTCFG_MT7925U=m' \
          'CPTCFG_MT7925E=m' \
          'CPTCFG_MT7996E=m' \
          'CPTCFG_WLAN_VENDOR_RALINK=y' \
          'CPTCFG_RT2X00=m' \
          'CPTCFG_RT2X00_LIB=m' \
          'CPTCFG_RT2X00_LIB_FIRMWARE=y' \
          'CPTCFG_RT2X00_USB=m' \
          'CPTCFG_RT2X00_PCI=m' \
          'CPTCFG_RT2800LIB=m' \
          'CPTCFG_RT2800USB=m' \
          'CPTCFG_RT2800USB_RT33XX=y' \
          'CPTCFG_RT2800USB_RT35XX=y' \
          'CPTCFG_RT2800USB_RT3573=y' \
          'CPTCFG_RT2800USB_RT53XX=y' \
          'CPTCFG_RT2800USB_RT55XX=y' \
          'CPTCFG_RT2800USB_UNKNOWN=y' \
          'CPTCFG_RT2500USB=m' \
          'CPTCFG_RT73USB=m' \
          'CPTCFG_RT2400PCI=m' \
          'CPTCFG_RT2500PCI=m' \
          'CPTCFG_RT2800PCI=m' \
          'CPTCFG_RT2800PCI_RT33XX=y' \
          'CPTCFG_RT2800PCI_RT35XX=y' \
          'CPTCFG_RT2800PCI_RT53XX=y' \
          'CPTCFG_RT2800PCI_RT3290=y' \
          'CPTCFG_WLAN_VENDOR_ATH=y' \
          'CPTCFG_ATH_COMMON=m' \
          'CPTCFG_ATH_CARDS=m' \
          'CPTCFG_ATH5K=m' \
          'CPTCFG_ATH9K=m' \
          'CPTCFG_ATH9K_HW=m' \
          'CPTCFG_ATH9K_COMMON=m' \
          'CPTCFG_ATH9K_COMMON_DEBUG=y' \
          'CPTCFG_ATH9K_DEBUGFS=y' \
          'CPTCFG_ATH9K_HTC=m' \
          'CPTCFG_ATH9K_HTC_DEBUGFS=y' \
          'CPTCFG_ATH6KL=m' \
          'CPTCFG_ATH6KL_USB=m' \
          'CPTCFG_ATH6KL_SDIO=m' \
          'CPTCFG_CARL9170=m' \
          'CPTCFG_AR5523=m' \
          'CPTCFG_WIL6210=m' \
          'CPTCFG_ATH10K=m' \
          'CPTCFG_ATH10K_PCI=m' \
          'CPTCFG_ATH10K_SDIO=m' \
          'CPTCFG_ATH10K_USB=m' \
          'CPTCFG_ATH10K_DEBUG=y' \
          'CPTCFG_ATH10K_DEBUGFS=y' \
          'CPTCFG_ATH11K=m' \
          'CPTCFG_ATH11K_PCI=m' \
          'CPTCFG_ATH11K_DEBUG=y' \
          'CPTCFG_ATH11K_DEBUGFS=y' \
          'CPTCFG_WCN36XX=m' \
          'CPTCFG_WCN36XX_DEBUGFS=y' \
          'CPTCFG_WLAN_VENDOR_ZYDAS=y' \
          'CPTCFG_ZD1211RW=m' \
          'CPTCFG_MHI_BUS=m' \
          'CPTCFG_QRTR=m' \
          'CPTCFG_QRTR_MHI=m' \
          >> .config
    
        make "${MAKE_FLAGS[@]}" KLIB="$KERNEL_BUILD" KLIB_BUILD="$KERNEL_BUILD" olddefconfig
    
        make -j$(nproc --all) "${MAKE_FLAGS[@]}" \
          KLIB="$KERNEL_BUILD" KLIB_BUILD="$KERNEL_BUILD" \
          V=1 2>&1 | tee ../backports-build.log
    
        KO_COUNT=$(find . -name '*.ko' | wc -l)
        echo "Backports built .ko count: $KO_COUNT"
        [ "$KO_COUNT" -gt 0 ] || exit 1
    
        mkdir -p ../backports-artifacts
        find . -name '*.ko' -exec cp --parents {} ../backports-artifacts/ \;
        cp .config ../backports-artifacts/backports.config
        cp ../backports-build.log ../backports-artifacts/

    - name: Archive backports modules (flat)
      if: success()
      shell: bash
      run: |
        set -euo pipefail
        if [ ! -d "$GITHUB_WORKSPACE/backports-artifacts" ]; then
          echo "Backports artifacts not found, skipping archive."
          exit 0
        fi
        mkdir -p /tmp/backports-flat
        find "$GITHUB_WORKSPACE/backports-artifacts" -name '*.ko' -exec cp {} /tmp/backports-flat/ \;
        cd /tmp/backports-flat
        zip -r "$ARTIFACTS_FOLDER/backports-all-modules.zip" .
        echo "Flat archive created: $ARTIFACTS_FOLDER/backports-all-modules.zip"
        
    - name: Create AnyKernel3 ZIP
      id: create_zip
      shell: bash
      run: |
        cp "$COMMON_KERNEL_FOLDER/out/arch/arm64/boot/Image" "$AK3_FOLDER/"
        cp "$ARTIFACTS_FOLDER/${OP_MODEL}.txt" "$AK3_FOLDER/"
        cd "$AK3_FOLDER"
        ZIP_NAME="AK3_${OP_MODEL}_${KERNEL_FULL_VER}_KSUN_${KSUVER}_SuSFS_${SUSVER}.zip"
        zip -r "$ZIP_NAME" . -x "*.git*"
        mv "$ZIP_NAME" "$ARTIFACTS_FOLDER/"
        ZIP_SHA256=$(sha256sum "$ARTIFACTS_FOLDER/$ZIP_NAME" | awk '{print $1}')
        echo "zip_sha256=$ZIP_SHA256" >> "$GITHUB_OUTPUT"
        echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

    - name: Collect Build Stats
      id: collect_stats
      shell: bash
      run: |
        IMG="$COMMON_KERNEL_FOLDER/out/arch/arm64/boot/Image"
        IMG_SHA256=$(sha256sum "$IMG" | awk '{print $1}')
        WARNINGS_COUNT=$(grep -ci warning "$COMMON_KERNEL_FOLDER/build.log" 2>/dev/null || echo 0)
        echo "image_sha256=$IMG_SHA256" >> "$GITHUB_OUTPUT"
        echo "warnings_count=$WARNINGS_COUNT" >> "$GITHUB_OUTPUT"

    - name: Upload Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
       name: kernel-${{ env.CONFIG }}
       path: |
        ${{ env.ARTIFACTS_FOLDER }}/AK3_*.zip
        ${{ env.ARTIFACTS_FOLDER }}/backports-all-modules.zip
        ${{ env.ARTIFACTS_FOLDER }}/linux-headers-*.deb
