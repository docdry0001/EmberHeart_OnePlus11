name: Build OnePlus EmberHeart Kernel

permissions:
  contents: write
  actions: write

inputs:
  op_config_json:
    description: 'JSON string containing full device config'
    required: true
    type: string
  ksun_branch_or_hash:
    description: 'KernelSU Next branch or commit hash (empty = auto)'
    required: false
    type: string
    default: ""
  susfs_commit_hash_or_branch:
    description: 'SUSFS branch or commit hash (empty = auto-detect by kernel version)'
    required: false
    type: string
    default: ""
  manifest:
    description: 'Manifest selection (OOS14, OOS15, OOS16, etc.)'
    required: false
    type: string
    default: "OOS16"
  optimize_level:
    description: 'Compiler optimization level (O2 or O3)'
    required: false
    type: string
    default: O2
  kernel_uname:
    description: 'Custom kernel localversion string'
    required: false
    type: string
    default: "EmberHeart"
  backports_release:
    description: 'Backports release version (git branch)'
    required: false
    type: string
    default: backports-6.1.97-1

outputs:
  kernel_version:
    value: ${{ steps.save_metadata.outputs.kernel_version }}
  ksu_version:
    value: ${{ steps.save_metadata.outputs.ksu_version }}
  susfs_version:
    value: ${{ steps.save_metadata.outputs.susfs_version }}
  image_sha256:
    value: ${{ steps.collect_stats.outputs.image_sha256 }}
  zip_sha256:
    value: ${{ steps.create_zip.outputs.zip_sha256 }}
  warnings:
    value: ${{ steps.collect_stats.outputs.warnings_count }}

runs:
  using: composite
  steps:
    - name: Parse op_config_json
      shell: bash
      run: |
        set -euo pipefail
        echo '${{ inputs.op_config_json }}' > /tmp/config.json
        jq -r 'to_entries[] | "OP_\(.key | ascii_upcase)=\(.value)"' /tmp/config.json >> "$GITHUB_ENV"
        echo "Parsed config:"
        jq '.' /tmp/config.json

    - name: Map Manifest Choice to XML
      shell: bash
      run: |
        choice="${{ inputs.manifest }}"
        case "${choice^^}" in
          OOS14)            var="OP_MANIFEST_OOS14" ;;
          OOS15)            var="OP_MANIFEST_OOS15" ;;
          FAST_BUILD_OOS15|OOS15_FAST) var="OP_MANIFEST_OOS15_MODULES" ;;
          OOS16)            var="OP_MANIFEST_OOS16" ;;
          OOS16_CUSTOM)     var="OP_MANIFEST_OOS16_CUSTOM" ;;
          *) echo "Unknown manifest choice: $choice"; exit 1 ;;
        esac
        manifest_file="${!var}"
        [ -n "$manifest_file" ] || { echo "Manifest variable $var is empty. Check config JSON."; exit 1; }
        echo "OP_MANIFEST=$manifest_file" >> "$GITHUB_ENV"
        echo "Using manifest file: $manifest_file"

    - name: Validate Inputs
      shell: bash
      run: |
        set -euo pipefail
        model="$OP_MODEL"
        soc="$OP_SOC"
        branch="$OP_BRANCH"
        manifest="$OP_MANIFEST"
        optimize='${{ inputs.optimize_level }}'
        [ -n "$model" ] || { echo "model empty"; exit 1; }
        [ -n "$soc" ] || { echo "soc empty"; exit 1; }
        [ -n "$branch" ] || { echo "branch empty"; exit 1; }
        [ -n "$manifest" ] || { echo "manifest empty"; exit 1; }
        case "$optimize" in O2|O3) ;; *) echo "optimize must be O2 or O3"; exit 1; ;; esac
        echo "✅ Validation passed"

    

    - name: Setup Base Environment
      shell: bash
      run: |
        set -euo pipefail
        CONFIG="$OP_MODEL"
        echo "Creating folder for configuration: $CONFIG"
        mkdir -p "$CONFIG"
        echo "CONFIG=$CONFIG" >> "$GITHUB_ENV"
        REPO="/usr/local/bin/repo"
        if [ ! -x "$REPO" ]; then
          curl -s https://storage.googleapis.com/git-repo-downloads/repo -o "$REPO"
          chmod +x "$REPO"
        fi
        echo "REPO=$REPO" >> "$GITHUB_ENV"

    - name: Optimize Global Git for Repo Tool
      shell: bash
      run: |
        set -euo pipefail
        git config --global feature.manyFiles true
        git config --global core.fsmonitor true
        git config --global pack.sparse true

    - name: Sync Kernel Source
      id: sync-kernel-source
      uses: ./action-source/.github/actions/kernel-source-sync
      with:
        source_location: ${{ env.CONFIG }}
        github_token: ${{ inputs.github_token }}
        debug: ${{ inputs.debug }}

    - name: Set Dir Paths
      shell: bash
      run: |
        set -euo pipefail
        CONFIG_DIR="$GITHUB_WORKSPACE/$CONFIG"
        ARTIFACTS_DIR="$CONFIG_DIR/artifacts"
        KERNEL_PLATFORM_DIR="$CONFIG_DIR/kernel_platform"
        COMMON_KERNEL_DIR="$KERNEL_PLATFORM_DIR/common"
        MSM_KERNEL_DIR="$KERNEL_PLATFORM_DIR/msm-kernel"
        AK3_DIR="$CONFIG_DIR/AnyKernel3"
        DEBUG_ARTIFACTS_DIR="$GITHUB_WORKSPACE/debug_artifacts"
        KERNEL_PATCHES_DIR="$GITHUB_WORKSPACE/kernel_patches"
        SUSFS_DIR="$GITHUB_WORKSPACE/susfs4ksu"
        KSU_DIR="$KERNEL_PLATFORM_DIR/KernelSU"
        KSUN_DIR="$KERNEL_PLATFORM_DIR/KernelSU-Next"
        mkdir -p "$ARTIFACTS_DIR"
        mkdir -p "$DEBUG_ARTIFACTS_DIR"
        
        # Save to environment for later steps
        echo "CONFIG_FOLDER=$CONFIG_DIR" >> "$GITHUB_ENV"
        echo "ARTIFACTS_FOLDER=$ARTIFACTS_DIR" >> "$GITHUB_ENV"
        echo "KERNEL_PLATFORM_FOLDER=$KERNEL_PLATFORM_DIR" >> "$GITHUB_ENV"
        echo "COMMON_KERNEL_FOLDER=$COMMON_KERNEL_DIR" >> "$GITHUB_ENV"
        echo "MSM_KERNEL_FOLDER=$MSM_KERNEL_DIR" >> "$GITHUB_ENV"
        echo "AK3_FOLDER=$AK3_DIR" >> "$GITHUB_ENV"
        echo "DEBUG_ARTIFACTS_FOLDER=$DEBUG_ARTIFACTS_DIR" >> "$GITHUB_ENV"
        echo "KERNEL_PATCHES_FOLDER=$KERNEL_PATCHES_DIR" >> "$GITHUB_ENV"
        echo "SUSFS_FOLDER=$SUSFS_DIR" >> "$GITHUB_ENV"
        echo "KSU_FOLDER=$KSU_DIR" >> "$GITHUB_ENV"
        echo "KSUN_FOLDER=$KSUN_DIR" >> "$GITHUB_ENV"
        
        DEBUG_ZIP_NAME="debug_${OP_MODEL}_${OP_OS_VERSION}.zip"
        echo "DEBUG_ZIP_NAME=$DEBUG_ZIP_NAME" >> "$GITHUB_ENV"

    - name: Set Kernel build-tools to Path
      shell: bash
      run: |
        # Set Kernel build-tools to Path
        set -euo pipefail
        echo "${KERNEL_PLATFORM_FOLDER}/prebuilts/kernel-build-tools/linux-x86/bin/" >> $GITHUB_PATH
        echo "${KERNEL_PLATFORM_FOLDER}/prebuilts/kernel-build-tools/linux_musl-x86/bin/" >> $GITHUB_PATH

    - name: Get Kernel Version Info
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Get kernel version"
        cd "$COMMON_KERNEL_FOLDER"
        
        CONFIG_FILES=("build.config.common" "build.config.constants")
        BRANCH_LINE=""
        for f in "${CONFIG_FILES[@]}"; do
          if [ -f "$f" ]; then
            l=$(grep '^[[:space:]]*BRANCH=' "$f" || true)
            if [ -n "$l" ]; then BRANCH_LINE="$l"; break; fi
          fi
        done
        
        if [ -z "$BRANCH_LINE" ]; then
          echo "::error::No BRANCH= found in config files"; exit 1
        fi
        
        BRANCH_VALUE="${BRANCH_LINE#*=}"
        ANDROID_VERSION="${BRANCH_VALUE%-*}"
        
        if [ -z "$ANDROID_VERSION" ]; then
          echo "::error::Could not parse android version from BRANCH=$BRANCH_VALUE"
          exit 1
        fi
        
        VERSION=$(grep '^VERSION *=' Makefile | awk '{print $3}')
        PATCHLEVEL=$(grep '^PATCHLEVEL *=' Makefile | awk '{print $3}')
        SUBLEVEL=$(grep '^SUBLEVEL *=' Makefile | awk '{print $3}')
        FULL_VERSION="$VERSION.$PATCHLEVEL.$SUBLEVEL"
        
        cd "$ARTIFACTS_FOLDER"
        echo "$ANDROID_VERSION-$FULL_VERSION" > "${OP_MODEL}_${OP_OS_VERSION}.txt"
        echo "$OP_OS_VERSION" >> "${OP_MODEL}_${OP_OS_VERSION}.txt"
        
        {
          echo "ANDROID_VER=$ANDROID_VERSION"
          echo "KERNEL_VER=$VERSION.$PATCHLEVEL"
          echo "TKERNEL_VER=$FULL_VERSION"
          echo "KERNEL_FULL_VER=$ANDROID_VERSION-$FULL_VERSION"
          if [ "${{ env.OP_SUSFS }}" = true ]; then
            echo "SUSFS_KERNEL_BRANCH=gki-$ANDROID_VERSION-$VERSION.$PATCHLEVEL"
          fi
        } >> "$GITHUB_ENV"
        
        echo "✅ Detected: $ANDROID_VERSION-$FULL_VERSION"
        if [ "${{ env.OP_SUSFS }}" = true ]; then
          echo "   SUSFS Branch: gki-$ANDROID_VERSION-$VERSION.$PATCHLEVEL"
        fi
        echo "::endgroup::"

    - name: 🏷️ Set Build Identity (Hardcoded)
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Set build user/host"
                
        BUILD_USER="OnePlus"
        BUILD_HOST="ubuntu-build"
        
        echo "BUILD_USER=$BUILD_USER" >> "$GITHUB_ENV"
        echo "BUILD_HOST=$BUILD_HOST" >> "$GITHUB_ENV"
        
        echo ""
        echo "✅ Build identity configured:"
        echo "   User: $BUILD_USER"
        echo "   Host: $BUILD_HOST"
        echo "::endgroup::"

    - name: Check or Detect Clang
      shell: bash
      run: |
        # Check or Detect Clang
        set -euo pipefail
        echo "::group::Detect Clang"
        CLANG_FOUND=false
        CLANG_BIN=""
        
        if [ -n "$OP_ZYC_COMPILER" ]; then
          # Priority 1: User explicitly wants ZyC compiler
          echo "OP_ZYC_COMPILER detected as download link: $OP_ZYC_COMPILER"
          
          ZYC_DIR="$CONFIG_FOLDER/compiler/zyc"
          TEMP_TAR="$CONFIG_FOLDER/compiler.tar.gz"
          mkdir -p "$ZYC_DIR"
          
          echo "Downloading ZyC Clang from link..."
          
          max_retries=5
          attempt=1
          download_success=false
          
          while [ $attempt -le $max_retries ]; do
            echo "Download attempt $attempt/$max_retries..."
            
            if curl -L --fail --retry 3 --retry-delay 5 --connect-timeout 60 -o "$TEMP_TAR" "$OP_ZYC_COMPILER"; then
                echo "Download successful."
                download_success=true
                break
            else
                echo "Download failed (attempt $attempt)."
                rm -f "$TEMP_TAR" 2>/dev/null
                if [ $attempt -eq $max_retries ]; then
                    echo "Error: Failed to download ZyC Clang after $max_retries attempts."
                    break
                fi
                attempt=$((attempt + 1))
                sleep 8
            fi
          done
        
          if [ "$download_success" = true ]; then
            # Extract
            echo "Extracting to $ZYC_DIR ..."
            if tar -xzf "$TEMP_TAR" -C "$ZYC_DIR" 2>/dev/null; then
              # Symlink extraction fix
              tar -xzf "$TEMP_TAR" -C "$ZYC_DIR" 2>/dev/null || true
              # Cleanup
              rm -f "$TEMP_TAR"
              
              # Verify clang exists
              if [ -x "$ZYC_DIR/bin/clang" ]; then
                  CLANG_BIN="$ZYC_DIR/bin"
                  CLANG_FOUND=true
                  echo "ZyC Clang successfully downloaded and extracted."
                  echo "Using: $CLANG_BIN/clang"
              else
                  echo "Warning: Extraction done, but clang binary not found at $ZYC_DIR/bin/clang"
              fi
            else
                echo "Error: Failed to extract the tar.gz file."
                rm -f "$TEMP_TAR"
            fi
          fi
        
        elif [ -n "$OP_C_COMPILER" ]; then
          # Priority 2: User specified a custom C compiler
          if [ -x "$CONFIG_FOLDER/$OP_C_COMPILER/clang" ]; then
            CLANG_BIN="$CONFIG_FOLDER/$OP_C_COMPILER"
            CLANG_FOUND=true
          else
            echo "Warning: OP_C_COMPILER='$OP_C_COMPILER' but clang binary not found at $CONFIG_FOLDER/$OP_C_COMPILER/clang"
          fi
        fi
        
        if [ "$CLANG_FOUND" = false ]; then
          # Priority 3: Auto-detect from prebuilts (when both variables are empty / user clang not found)
          for base in "$KERNEL_PLATFORM_FOLDER/prebuilts" "$KERNEL_PLATFORM_FOLDER/prebuilts-master"; do
            [ -d "$base/clang/host/linux-x86" ] || continue
            latest=$(ls -d "$base/clang/host/linux-x86/clang-r"* 2>/dev/null | sort -V | tail -n1 || true)
            if [ -n "$latest" ] && [ -x "$latest/bin/clang" ]; then
              CLANG_BIN="$latest/bin"
              CLANG_FOUND=true
              break
            fi
          done
        fi
        
        if [ "$CLANG_FOUND" = false ] && command -v clang >/dev/null 2>&1; then
          # Priority 4: Fallback to system-installed clang
          CLANG_BIN="$(dirname "$(command -v clang)")"
          CLANG_FOUND=true
          echo "Using system clang."
        fi
        
        [ "$CLANG_FOUND" = true ] || { echo "::error::No clang toolchain found"; exit 1; }
        
        echo "CLANG_BIN_PATH=$CLANG_BIN" >> "$GITHUB_ENV"
        
        CLANG_VERSION="$("$CLANG_BIN/clang" --version | head -n1)"
        echo "CLANG_VERSION=$CLANG_VERSION" >> "$GITHUB_ENV"
        
        echo "Derive Clang fingerprint"
        
        short="$("${CLANG_BIN}/clang" --version | sed -n '1s/.*clang-r\([0-9.]\+\).*/\1/p')"
        
        if [ -z "$short" ]; then
          short="$("${CLANG_BIN}/clang" --version | sha256sum | cut -c1-8)"
          echo "⚠️ Could not extract clang-r version, using hash: $short"
        else
          echo "✅ Clang version fingerprint: $short"
        fi
        
        echo "CLANG_VERSION_SHORT=$short" >> "$GITHUB_ENV"
        echo "$CLANG_BIN" >> $GITHUB_PATH
        echo "LIBCLANG_PATH=$CLANG_BIN/../lib" >> "$GITHUB_ENV"
        
        echo "✅ Detected Clang: $CLANG_VERSION"
        echo "::endgroup::"

    - name: Check or Detect Rust & bindgen
      shell: bash
      if: ${{ env.OP_RUST_BUILD == 'true' }}
      run: |
        # Check or Detect Rust & bindgen
        set -euo pipefail
        echo "::group::Detect Rust & bindgen"
        RUSTC_FOUND=false
        BINDGEN_FOUND=false
        
        if [ -z "$OP_RUST_COMPILER" ]; then
          for base in "$KERNEL_PLATFORM_FOLDER/prebuilts" "$KERNEL_PLATFORM_FOLDER/prebuilts-master"; do
            [ -d "$base/rust/linux-x86" ] || continue
            latest=$(ls -d "$base/rust/linux-x86/1."* 2>/dev/null | sort -V | head -n1 || true)
            if [ -n "$latest" ] && [ -x "$latest/bin/rustc" ]; then
              RUSTC_BIN="$latest/bin"
              RUSTC_FOUND=true
              break
            fi
          done
        else
          if [ -x "$CONFIG_FOLDER/$OP_RUST_COMPILER/rustc" ]; then
            RUSTC_BIN="$CONFIG_FOLDER/$OP_RUST_COMPILER"
            RUSTC_FOUND=true
          fi
        fi
        
        if [ -z "$OP_BINDGEN" ]; then
          for base in "$KERNEL_PLATFORM_FOLDER/prebuilts" "$KERNEL_PLATFORM_FOLDER/prebuilts-master"; do
            [ -d "$base/clang-tools/linux-x86" ] || continue
            if [ -x "$base/clang-tools/linux-x86/bin/bindgen" ]; then
              BINDGEN_BIN="$base/clang-tools/linux-x86/bin"
              BINDGEN_FOUND=true
              chmod +x "$base/clang-tools/linux-x86/bin/bindgen"
              break
            fi
          done
        else
          if [ -x "$CONFIG_FOLDER/$OP_BINDGEN/bindgen" ]; then
            BINDGEN_BIN="$CONFIG_FOLDER/$OP_BINDGEN"
            BINDGEN_FOUND=true
            chmod +x "$CONFIG_FOLDER/$OP_BINDGEN/bindgen"
          fi
        fi
        
        [ "$RUSTC_FOUND" = true ] || { echo "::error::No RUST toolchain found"; exit 1; }
        [ "$BINDGEN_FOUND" = true ] || { echo "::warning::No bindgen found"; }
        
        echo "RUSTC_BIN_PATH=$RUSTC_BIN" >> "$GITHUB_ENV"
        RUSTC_VERSION="$("$RUSTC_BIN/rustc" --version | head -n1)"
        echo "RUSTC_VERSION=$RUSTC_VERSION" >> "$GITHUB_ENV"
        echo "RUSTC=$RUSTC_BIN/rustc" >> "$GITHUB_ENV"
        echo "$RUSTC_BIN" >> $GITHUB_PATH
        echo "✅ Detected RUSTC: $RUSTC_VERSION"
        
        if [ "$BINDGEN_FOUND" = true ]; then
          echo "BINDGEN_BIN_PATH=$BINDGEN_BIN" >> "$GITHUB_ENV"
          BINDGEN_VERSION="$("$BINDGEN_BIN/bindgen" --version | head -n1)"
          echo "BINDGEN_VERSION=$BINDGEN_VERSION" >> "$GITHUB_ENV"
          echo "$BINDGEN_BIN" >> $GITHUB_PATH
          echo "BINDGEN=$BINDGEN_BIN/bindgen" >> "$GITHUB_ENV"
          echo "✅ Detected BINDGEN: $BINDGEN_VERSION"
        fi
        
        echo "::endgroup::"

    - name: Install bindgen only (no rustc)
      shell: bash
      if: ${{ env.OP_RUST_BUILD == 'true'  && !env.BINDGEN_BIN_PATH }}
      run: |
        # Install bindgen via cargo (no full rustc needed)
        set -euo pipefail
        echo "::group::Install bindgen only (no rustc)"
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
        source $HOME/.cargo/env
        
        # Install bindgen CLI only (~50-100MB total)
        cargo install bindgen-cli --version 0.69.5
        
        BINDGEN=$(which bindgen)
        BINDGEN_BIN=$(dirname $BINDGEN)
        echo "$BINDGEN_BIN" >> $GITHUB_PATH
        echo "BINDGEN=$BINDGEN" >> "$GITHUB_ENV"
        
        # Verify
        bindgen --version
        echo "::endgroup::"

    - name: Test Rust & bindgen
      shell: bash
      if: ${{ env.OP_RUST_BUILD == 'true' }}
      run: |
        # Test Rust & bindgen
        set -euo pipefail
        echo "::group::Test Rust & bindgen"
        cd "$COMMON_KERNEL_FOLDER"
        export RUSTTARGET="aarch64-linux-android"
        make V=1 rustavailable
        echo "::endgroup::"

    - name: Restore ccache cache
      id: restore-ccache-cache
      uses: ./action-source/.github/actions/cache/restore
      if: ${{ inputs.clean == false || inputs.clean == 'false' }}
      with:
        cache_path: ${{ env.CCACHE_DIR }}
        cache_key: ${{ inputs.ksu_type }}-v3-${{ env.OP_MODEL }}-${{ env.OP_OS_VERSION }}-${{ env.KERNEL_FULL_VER }}-${{ env.CLANG_VERSION_SHORT }}
        cache_bucket: "ccache-cache"
        debug: ${{ inputs.debug }}
        restore_keys: |
          ${{ inputs.ksu_type }}-v3-${{ env.OP_MODEL }}-${{ env.OP_OS_VERSION }}-${{ env.KERNEL_FULL_VER }}-
          ${{ inputs.ksu_type }}-v3-${{ env.OP_MODEL }}-${{ env.OP_OS_VERSION }}-

    - name: Restore LTO LD cache
      id: restore-lto-ld-cache
      uses: ./action-source/.github/actions/cache/restore
      if: ${{ (inputs.clean == false && env.OP_LTO != 'none') || (inputs.clean == 'false' && env.OP_LTO != 'none') }}
      with:
        cache_path: ${{ env.LDCACHE_DIR }}
        cache_key: ${{ inputs.ksu_type }}-v3-LTO-${{ env.OP_MODEL }}-${{ env.OP_OS_VERSION }}-${{ env.KERNEL_FULL_VER }}-${{ env.CLANG_VERSION_SHORT }}
        cache_bucket: "lto-cache"
        debug: ${{ inputs.debug }}
        restore_keys: |
          ${{ inputs.ksu_type }}-v3-LTO-${{ env.OP_MODEL }}-${{ env.OP_OS_VERSION }}-${{ env.KERNEL_FULL_VER }}-
          ${{ inputs.ksu_type }}-v3-LTO-${{ env.OP_MODEL }}-${{ env.OP_OS_VERSION }}-

    - name: Check and Prepare Caches
      shell: bash
      run: |
        echo "::group::Check ccache"
        set -euo pipefail
        
        echo "/usr/lib/ccache" >> $GITHUB_PATH
        
        echo "Current ccache configuration:"
        ccache -p
        
        if [ -d "$CCACHE_DIR" ] && find "$CCACHE_DIR" -type f -print -quit 2>/dev/null | grep -q .; then
          echo "✅ Restored cache found"
          echo ""
          echo "Pre-build cache statistics:"
          ccache -s | head -n 20
          
          echo "Updating atime to achive cache eviction"
          find ${{ env.CCACHE_DIR }} -type f -exec touch -t $(date -d "1 day ago" +%Y%m%d%H%M) {} +
        else
          echo "⚠️ No existing cache - building from scratch"
          echo "Cache will be populated for future builds"
        fi
        
        ccache -z
        
        # Setup and check LTO Cache
        if [ -d "$LDCACHE_DIR" ] && find "$LDCACHE_DIR" -type f -print -quit 2>/dev/null | grep -q .; then
          echo "✅ Restored LTO LD cache found"
          
          echo "Updating LTO cache atime for cache eviction..."
          find ${{ env.LDCACHE_DIR }} -type f -exec touch -t $(date -d "1 day ago" +%Y%m%d%H%M) {} +
        else
          echo "⚠️ No existing LTO cache - linker will generate new artifacts"
        fi
        echo "::endgroup::"

    - name: Fetch SusFS and Other Dependencies
      shell: bash
      run: |
        echo "::group::Fetch dependencies"
        set -euo pipefail
        echo "Fetching SusFS and other dependencies..."
        
        
        if [ "${{ env.OP_SUSFS }}" = true ]; then
          # Determine SUSFS branch/commit to use
          SUSFS_INPUT="${{ inputs.susfs_commit_hash_or_branch }}"
          
          # Default SUSFS branches for each kernel version
          declare -A DEFAULT_SUSFS=(
            ["android12-5.10"]="gki-android12-5.10"
            ["android13-5.15"]="gki-android13-5.15"
            ["android14-6.1"]="gki-android14-6.1"
            ["android15-6.6"]="gki-android15-6.6"
            ["android16-6.12"]="gki-android16-6.12"
          )
          
          # Determine which SUSFS ref to use
          KERNEL_KEY="${{ env.ANDROID_VER }}-${{ env.KERNEL_VER }}"
          if [ -z "$SUSFS_INPUT" ]; then
            # use kernel-specific default
            SUSFS_BRANCH="${DEFAULT_SUSFS[$KERNEL_KEY]:-gki-android15-6.6}"
            echo "ℹ️  Using default SUSFS branch for $KERNEL_KEY: $SUSFS_BRANCH"
          else
            # 40-char hash or branch/commit passed directly
            SUSFS_BRANCH="$SUSFS_INPUT"
            echo "🔧 Using resolved SUSFS ref: $SUSFS_BRANCH"
          fi
        fi
        
        retry_fetch_archive() {
          local url="$1"
          local branch="${2:-main}"
          local max_attempts=3
          local attempt=1
          
          local repo_name=$(basename "$url" .git)
          local safe_branch=$(echo "$branch" | tr '/' '_')
          local archive_name="${repo_name}_${safe_branch}.tar.gz"
          local shm_path="/dev/shm/$archive_name"
          
          local nproc=$(nproc 2>/dev/null || echo 4)
          
          local aria_log_flags="--quiet --summary-interval=0"
          if [ "${{ inputs.debug }}" = "true" ]; then
              aria_log_flags="--summary-interval=5" # Show progress every 5s in debug
          fi
          
          local aria2_headers=(
            "--header=User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
            "--header=Accept: */*"
            "--header=Connection: keep-alive"
          )
          
          local download_url=""
          if [[ "$url" == *"github.com"* ]]; then
              download_url="${url%.git}/archive/refs/heads/${branch}.tar.gz"
          elif [[ "$url" == *"gitlab.com"* ]]; then
              download_url="${url%.git}/-/archive/${branch}/${repo_name}-${branch}.tar.gz"
          else
              echo "::error::Unsupported host: $url"
              return 1
          fi
          
          while [ $attempt -le $max_attempts ]; do
              echo " Attempt $attempt/$max_attempts: High-speed fetch for $repo_name ($branch)"
              
              if aria2c -x16 -s16 -j16 -k1M --retry-wait=2 --max-tries=5 -d "/dev/shm" -o "$archive_name" --allow-overwrite=true "${aria2_headers[@]}" $aria_log_flags "$download_url"; then
                  mkdir -p "$repo_name"
                  if tar -I "pigz -p $nproc -b 256" -x --record-size=1M -f "$shm_path" -C "$repo_name" --strip
                  
    - name: Add Nethunter Inline Configs
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Applying Nethunter configs..."
        cd "$COMMON_KERNEL_FOLDER"

        # Bluetooth configs
        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_BT_HCIBTUSB \
          --enable CONFIG_BT_HCIBTUSB_BCM \
          --enable CONFIG_BT_HCIBTUSB_RTL \
          --enable CONFIG_BT_HCIVHCI \
          --enable CONFIG_BT_HCIBCM203X \
          --enable CONFIG_BT_HCIBPA10X \
          --enable CONFIG_BT_HCIBFUSB

        # Airspy & HackRF
        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_USB_AIRSPY \
          --enable CONFIG_USB_HACKRF

        # CAN
        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_CAN \
          --enable CONFIG_CAN_DEV \
          --enable CONFIG_CAN_CALC_BITTIMING \
          --enable CONFIG_CAN_LEDS \
          --enable CONFIG_CAN_VCAN \
          --enable CONFIG_CAN_GRCAN \
          --enable CONFIG_CAN_XILINXCAN

        # Bosch C_CAN/D_CAN devices
        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_CAN_C_CAN \
          --enable CONFIG_CAN_C_CAN_PLATFORM \
          --enable CONFIG_CAN_C_CAN_PCI

        # Bosch CC770 and Intel AN82527 devices
        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_CAN_CC770 \
          --enable CONFIG_CAN_CC770_ISA \
          --enable CONFIG_CAN_CC770_PLATFORM

        # Bosch M_CAN devices
        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_CAN_M_CAN \
          --enable CONFIG_CAN_M_CAN_PCI \
          --enable CONFIG_CAN_M_CAN_PLATFORM \
          --enable CONFIG_CAN_M_CAN_TCAN4X5X

        # CAN SPI interfaces
        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_CAN_HI311X \
          --enable CONFIG_CAN_MCP251X

        # CAN USB interfaces
        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_CAN_8DEV_USB \
          --enable CONFIG_CAN_EMS_USB \
          --enable CONFIG_CAN_ESD_USB2 \
          --enable CONFIG_CAN_GS_USB \
          --enable CONFIG_CAN_KVASER_USB \
          --enable CONFIG_CAN_PEAK_USB

        # CAN - Networking
        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_NETLINK_DIAG \
          --enable CONFIG_VSOCKETS \
          --enable CONFIG_NET_SCHED \
          --enable CONFIG_NET_EMATCH_CANID

        # USB Serial Converter
        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_USB_SERIAL \
          --enable CONFIG_USB_SERIAL_CONSOLE \
          --enable CONFIG_USB_SERIAL_GENERIC \
          --enable CONFIG_USB_SERIAL_CH341 \
          --enable CONFIG_USB_SERIAL_FTDI_SIO \
          --enable CONFIG_USB_SERIAL_PL2303

        # Mediatek drivers
        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_WLAN_VENDOR_MEDIATEK \
          --enable CONFIG_MT7601U \
          --enable CONFIG_MT76_CORE \
          --enable CONFIG_MT76_PCI \
          --enable CONFIG_MT76_USB \
          --enable CONFIG_MT76x02_LIB \
          --enable CONFIG_MT76x02_USB \
          --enable CONFIG_MT76_CONNAC_LIB \
          --enable CONFIG_MT7603E \
          --enable CONFIG_MT76x2_COMMON \
          --enable CONFIG_MT76x0_COMMON \
          --enable CONFIG_MT7615_COMMON \
          --enable CONFIG_MT7915E \
          --enable CONFIG_MT7921_COMMON \
          --enable CONFIG_MT7921E \
          --enable CONFIG_MT7921U

        # Other configs
        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_MAC80211_LEDS \
          --enable CONFIG_CAN_SLCAN
          
        echo "Nethunter configs applied ✅"
        echo "::endgroup::"

    - name: Add TTL Support
      shell: bash
      run: |
        cat >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" <<-EOF
        	CONFIG_IP_NF_TARGET_TTL=y
        	CONFIG_IP6_NF_TARGET_HL=y
        	CONFIG_IP6_NF_MATCH_HL=y
        EOF

    - name: Add IP_SET & IPv6 NAT
      shell: bash
      run: |
        cat >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" <<-EOF
        	CONFIG_IP_SET=y
        	CONFIG_IP_SET_MAX=65534
        	CONFIG_IP_SET_BITMAP_IP=y
        	CONFIG_IP_SET_BITMAP_IPMAC=y
        	CONFIG_IP_SET_BITMAP_PORT=y
        	CONFIG_IP_SET_HASH_IP=y
        	CONFIG_IP_SET_HASH_IPPORT=y
        	CONFIG_IP_SET_HASH_IPPORTIP=y
        	CONFIG_IP_SET_HASH_IPPORTNET=y
        	CONFIG_IP_SET_HASH_IPMAC=y
        	CONFIG_IP_SET_HASH_MAC=y
        	CONFIG_IP_SET_HASH_NET=y
        	CONFIG_IP_SET_HASH_NETPORT=y
        	CONFIG_IP_SET_HASH_NETIFACE=y
        	CONFIG_IP_SET_LIST_SET=y
        	CONFIG_IP6_NF_NAT=y
        	CONFIG_IP6_NF_TARGET_MASQUERADE=y
        EOF

    - name: Add BBR
      shell: bash
      run: |
        cat >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" <<-EOF
        	CONFIG_TCP_CONG_ADVANCED=y
        	CONFIG_TCP_CONG_BBR=y
        	CONFIG_NET_SCH_FQ=y
        	CONFIG_NET_SCH_FQ_CODEL=y
        EOF

    - name: Add Build Configs & MAC80211=m
      shell: bash
      run: |
        cd "$COMMON_KERNEL_FOLDER"
        cat >> arch/arm64/configs/gki_defconfig <<-EOF
        	CONFIG_LTO_CLANG_THIN=y
        	CONFIG_LTO_CLANG=y
        	CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
        	CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3=n
        	CONFIG_OPTIMIZE_INLINING=y
        	CONFIG_FRAME_WARN=0
        	CONFIG_TRACEPOINTS=y
        EOF
        ./scripts/config --file arch/arm64/configs/gki_defconfig --enable CONFIG_MAC80211

    - name: Save Build Metadata
      id: save_metadata
      shell: bash
      run: |
        cd "$ARTIFACTS_FOLDER"
        echo "kernel_version=$KERNEL_FULL_VER" >> "$GITHUB_OUTPUT"
        echo "ksu_version=$KSUVER" >> "$GITHUB_OUTPUT"
        echo "susfs_version=$SUSVER" >> "$GITHUB_OUTPUT"

    - name: Detect Clang
      shell: bash
      run: |
        for base in "$KERNEL_PLATFORM_FOLDER/prebuilts" "$KERNEL_PLATFORM_FOLDER/prebuilts-master"; do
          [ -d "$base/clang/host/linux-x86" ] || continue
          latest=$(ls -d "$base/clang/host/linux-x86/clang-r"* 2>/dev/null | sort -V | tail -n1 || true)
          if [ -n "$latest" ] && [ -x "$latest/bin/clang" ]; then
            CLANG_BIN="$latest/bin"
            break
          fi
        done
        [ -z "${CLANG_BIN:-}" ] && { echo "No clang found"; exit 1; }
        echo "CLANG_BIN_PATH=$CLANG_BIN" >> "$GITHUB_ENV"

    - name: Build Kernel
      shell: bash
      run: |
        export LLVM=1 LLVM_IAS=1 ARCH=arm64 SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu- LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
        export PATH="/usr/lib/ccache:${CLANG_BIN_PATH}:$PATH"
        export CC="ccache clang" HOSTCC="ccache clang" HOSTCXX="ccache clang++"
        cd "$COMMON_KERNEL_FOLDER"
        : > .scmversion
        OUT=out
        mkdir -p "$OUT"
        make O="$OUT" gki_defconfig
        ./scripts/config --file "$OUT/.config" --set-str LOCALVERSION "-${ANDROID_VER}-${{ inputs.kernel_uname }}"
        make O="$OUT" olddefconfig
        make -j$(nproc --all) O="$OUT" modules_prepare
        make -j$(nproc --all) O="$OUT" Image || { echo "Kernel build failed"; exit 1; }
    
    - name: Build Linux Headers .deb Package
      if: success()
      shell: bash
      run: |
        set -euo pipefail
        cd "$COMMON_KERNEL_FOLDER"
        OUT=out
        KERNELRELEASE=$(make O="$OUT" -s kernelrelease)
        HEADERS_DIR="$GITHUB_WORKSPACE/linux-headers-$KERNELRELEASE"
        rm -rf "$HEADERS_DIR"
        mkdir -p "$HEADERS_DIR/DEBIAN"
        mkdir -p "$HEADERS_DIR/usr/src/linux-headers-$KERNELRELEASE"
    
        # Install headers
        make O="$OUT" ARCH=arm64 headers_install INSTALL_HDR_PATH="$HEADERS_DIR/usr"
    
        # Copy .config and Module.symvers (if exists)
        cp "$OUT/.config" "$HEADERS_DIR/usr/src/linux-headers-$KERNELRELEASE/.config"
        if [ -f "$OUT/Module.symvers" ]; then
          cp "$OUT/Module.symvers" "$HEADERS_DIR/usr/src/linux-headers-$KERNELRELEASE/Module.symvers"
        else
          echo "::warning::Module.symvers not found; headers package will lack symbol version info"
        fi
    
        # Create control file
        cat > "$HEADERS_DIR/DEBIAN/control" <<-EOF
        Package: linux-headers-$KERNELRELEASE
        Version: $KERNELRELEASE
        Architecture: arm64
        Maintainer: $BUILD_USER <$BUILD_USER@$BUILD_HOST>
        Description: Linux kernel headers for $KERNELRELEASE
         This package provides kernel header files for version $KERNELRELEASE,
         useful for building external kernel modules like DKMS or manual compilations.
        EOF
    
        # Build .deb
        cd "$GITHUB_WORKSPACE"
        dpkg-deb --build "linux-headers-$KERNELRELEASE"
        mv "linux-headers-${KERNELRELEASE}.deb" "$ARTIFACTS_FOLDER/"
        echo "✅ Headers .deb created: $ARTIFACTS_FOLDER/linux-headers-${KERNELRELEASE}.deb"

    - name: Build Backports 6.1.97-1 (Full Wi-Fi driver set)
      shell: bash
      run: |
        set -euo pipefail
        RELEASE="${{ inputs.backports_release }}"
        URL="https://cdn.kernel.org/pub/linux/kernel/projects/backports/stable/v6.1.97/${RELEASE}.tar.xz"
        KERNEL_BUILD="$GITHUB_WORKSPACE/$CONFIG/kernel_platform/common/out"
    
        if [ -n "${CLANG_BIN_PATH:-}" ] && [ -x "${CLANG_BIN_PATH}/clang" ]; then
          export PATH="${CLANG_BIN_PATH}:$PATH"
        fi
        export PATH="/usr/lib/ccache:$PATH"
    
        MAKE_FLAGS=(
          LLVM=1 LLVM_IAS=1 ARCH=arm64 SUBARCH=arm64
          CLANG_TRIPLE=aarch64-linux-gnu-
          CROSS_COMPILE=aarch64-linux-gnu-
          CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          LD=ld.lld HOSTLD=ld.lld AR=llvm-ar NM=llvm-nm
          OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump
          DEPMOD=depmod DTC=dtc STRIP=llvm-strip
          HOSTCC=clang HOSTCXX=clang++ CC=clang
        )
    
        cd "$GITHUB_WORKSPACE"
        wget -q -O backports.tar.xz "$URL"
        tar -xf backports.tar.xz
        rm -rf backports-stable
        mv "$RELEASE" backports-stable
        cd backports-stable
    
        # Patch CFI macro
        FILE="backport-include/linux/module.h"
        sed -i 's/__CFI_ADDRESSABLE(init_module, __initdata)/__CFI_ADDRESSABLE(init_module)/g' "$FILE"
        sed -i 's/__CFI_ADDRESSABLE(cleanup_module, __exitdata)/__CFI_ADDRESSABLE(cleanup_module)/g' "$FILE"
    
        make "${MAKE_FLAGS[@]}" KLIB="$KERNEL_BUILD" KLIB_BUILD="$KERNEL_BUILD" allnoconfig
    
        # Full CPTCFG list via printf
        printf '%s\n' \
          'CPTCFG_CFG80211=m' \
          'CPTCFG_CFG80211_DEFAULT_PS=y' \
          'CPTCFG_CFG80211_DEBUGFS=y' \
          'CPTCFG_CFG80211_WEXT=y' \
          'CPTCFG_MAC80211=m' \
          'CPTCFG_MAC80211_LEDS=y' \
          'CPTCFG_MAC80211_MESH=y' \
          'CPTCFG_MAC80211_DEBUGFS=y' \
          'CPTCFG_MAC80211_MESSAGE_TRACING=y' \
          'CPTCFG_WLAN=y' \
          'CPTCFG_NL80211_TESTMODE=y' \
          'CPTCFG_USB=y' \
          'CPTCFG_PCI=y' \
          'CPTCFG_WLAN_VENDOR_MEDIATEK=y' \
          'CPTCFG_MT76_CORE=m' \
          'CPTCFG_MT76_USB=m' \
          'CPTCFG_MT76_PCI=m' \
          'CPTCFG_MT76_SDIO=m' \
          'CPTCFG_MT76_CONNAC_LIB=m' \
          'CPTCFG_MT76x0_COMMON=m' \
          'CPTCFG_MT76x0U=m' \
          'CPTCFG_MT76x0E=m' \
          'CPTCFG_MT76x2_COMMON=m' \
          'CPTCFG_MT76x2U=m' \
          'CPTCFG_MT76x2E=m' \
          'CPTCFG_MT7601U=m' \
          'CPTCFG_MT7603E=m' \
          'CPTCFG_MT7615_COMMON=m' \
          'CPTCFG_MT7615E=m' \
          'CPTCFG_MT7663_USB_SDIO_COMMON=m' \
          'CPTCFG_MT7663U=m' \
          'CPTCFG_MT7663S=m' \
          'CPTCFG_MT7915E=m' \
          'CPTCFG_MT7921_COMMON=m' \
          'CPTCFG_MT7921U=m' \
          'CPTCFG_MT7921S=m' \
          'CPTCFG_MT7921E=m' \
          'CPTCFG_MT7925_COMMON=m' \
          'CPTCFG_MT7925U=m' \
          'CPTCFG_MT7925E=m' \
          'CPTCFG_MT7996E=m' \
          'CPTCFG_WLAN_VENDOR_RALINK=y' \
          'CPTCFG_RT2X00=m' \
          'CPTCFG_RT2X00_LIB=m' \
          'CPTCFG_RT2X00_LIB_FIRMWARE=y' \
          'CPTCFG_RT2X00_USB=m' \
          'CPTCFG_RT2X00_PCI=m' \
          'CPTCFG_RT2800LIB=m' \
          'CPTCFG_RT2800USB=m' \
          'CPTCFG_RT2800USB_RT33XX=y' \
          'CPTCFG_RT2800USB_RT35XX=y' \
          'CPTCFG_RT2800USB_RT3573=y' \
          'CPTCFG_RT2800USB_RT53XX=y' \
          'CPTCFG_RT2800USB_RT55XX=y' \
          'CPTCFG_RT2800USB_UNKNOWN=y' \
          'CPTCFG_RT2500USB=m' \
          'CPTCFG_RT73USB=m' \
          'CPTCFG_RT2400PCI=m' \
          'CPTCFG_RT2500PCI=m' \
          'CPTCFG_RT2800PCI=m' \
          'CPTCFG_RT2800PCI_RT33XX=y' \
          'CPTCFG_RT2800PCI_RT35XX=y' \
          'CPTCFG_RT2800PCI_RT53XX=y' \
          'CPTCFG_RT2800PCI_RT3290=y' \
          'CPTCFG_WLAN_VENDOR_ATH=y' \
          'CPTCFG_ATH_COMMON=m' \
          'CPTCFG_ATH_CARDS=m' \
          'CPTCFG_ATH5K=m' \
          'CPTCFG_ATH9K=m' \
          'CPTCFG_ATH9K_HW=m' \
          'CPTCFG_ATH9K_COMMON=m' \
          'CPTCFG_ATH9K_COMMON_DEBUG=y' \
          'CPTCFG_ATH9K_DEBUGFS=y' \
          'CPTCFG_ATH9K_HTC=m' \
          'CPTCFG_ATH9K_HTC_DEBUGFS=y' \
          'CPTCFG_ATH6KL=m' \
          'CPTCFG_ATH6KL_USB=m' \
          'CPTCFG_ATH6KL_SDIO=m' \
          'CPTCFG_CARL9170=m' \
          'CPTCFG_AR5523=m' \
          'CPTCFG_WIL6210=m' \
          'CPTCFG_ATH10K=m' \
          'CPTCFG_ATH10K_PCI=m' \
          'CPTCFG_ATH10K_SDIO=m' \
          'CPTCFG_ATH10K_USB=m' \
          'CPTCFG_ATH10K_DEBUG=y' \
          'CPTCFG_ATH10K_DEBUGFS=y' \
          'CPTCFG_ATH11K=m' \
          'CPTCFG_ATH11K_PCI=m' \
          'CPTCFG_ATH11K_DEBUG=y' \
          'CPTCFG_ATH11K_DEBUGFS=y' \
          'CPTCFG_WCN36XX=m' \
          'CPTCFG_WCN36XX_DEBUGFS=y' \
          'CPTCFG_WLAN_VENDOR_ZYDAS=y' \
          'CPTCFG_ZD1211RW=m' \
          'CPTCFG_MHI_BUS=m' \
          'CPTCFG_QRTR=m' \
          'CPTCFG_QRTR_MHI=m' \
          >> .config
    
        make "${MAKE_FLAGS[@]}" KLIB="$KERNEL_BUILD" KLIB_BUILD="$KERNEL_BUILD" olddefconfig
    
        make -j$(nproc --all) "${MAKE_FLAGS[@]}" \
          KLIB="$KERNEL_BUILD" KLIB_BUILD="$KERNEL_BUILD" \
          V=1 2>&1 | tee ../backports-build.log
    
        KO_COUNT=$(find . -name '*.ko' | wc -l)
        echo "Backports built .ko count: $KO_COUNT"
        [ "$KO_COUNT" -gt 0 ] || exit 1
    
        mkdir -p ../backports-artifacts
        find . -name '*.ko' -exec cp --parents {} ../backports-artifacts/ \;
        cp .config ../backports-artifacts/backports.config
        cp ../backports-build.log ../backports-artifacts/

    - name: Archive backports modules (flat)
      if: success()
      shell: bash
      run: |
        set -euo pipefail
        if [ ! -d "$GITHUB_WORKSPACE/backports-artifacts" ]; then
          echo "Backports artifacts not found, skipping archive."
          exit 0
        fi
        mkdir -p /tmp/backports-flat
        find "$GITHUB_WORKSPACE/backports-artifacts" -name '*.ko' -exec cp {} /tmp/backports-flat/ \;
        cd /tmp/backports-flat
        zip -r "$ARTIFACTS_FOLDER/backports-all-modules.zip" .
        echo "Flat archive created: $ARTIFACTS_FOLDER/backports-all-modules.zip"
        
    - name: Create AnyKernel3 ZIP
      id: create_zip
      shell: bash
      run: |
        cp "$COMMON_KERNEL_FOLDER/out/arch/arm64/boot/Image" "$AK3_FOLDER/"
        cp "$ARTIFACTS_FOLDER/${OP_MODEL}.txt" "$AK3_FOLDER/"
        cd "$AK3_FOLDER"
        ZIP_NAME="AK3_${OP_MODEL}_${KERNEL_FULL_VER}_KSUN_${KSUVER}_SuSFS_${SUSVER}.zip"
        zip -r "$ZIP_NAME" . -x "*.git*"
        mv "$ZIP_NAME" "$ARTIFACTS_FOLDER/"
        ZIP_SHA256=$(sha256sum "$ARTIFACTS_FOLDER/$ZIP_NAME" | awk '{print $1}')
        echo "zip_sha256=$ZIP_SHA256" >> "$GITHUB_OUTPUT"
        echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

    - name: Collect Build Stats
      id: collect_stats
      shell: bash
      run: |
        IMG="$COMMON_KERNEL_FOLDER/out/arch/arm64/boot/Image"
        IMG_SHA256=$(sha256sum "$IMG" | awk '{print $1}')
        WARNINGS_COUNT=$(grep -ci warning "$COMMON_KERNEL_FOLDER/build.log" 2>/dev/null || echo 0)
        echo "image_sha256=$IMG_SHA256" >> "$GITHUB_OUTPUT"
        echo "warnings_count=$WARNINGS_COUNT" >> "$GITHUB_OUTPUT"

    - name: Upload Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
       name: kernel-${{ env.CONFIG }}
       path: |
        ${{ env.ARTIFACTS_FOLDER }}/AK3_*.zip
        ${{ env.ARTIFACTS_FOLDER }}/backports-all-modules.zip
        ${{ env.ARTIFACTS_FOLDER }}/linux-headers-*.deb
