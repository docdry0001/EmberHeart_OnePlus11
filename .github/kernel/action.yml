name: 'Build OnePlus Kernel with KernelSU Next'

inputs:
  op_config_json:
    description: 'JSON string containing full device config'
    required: true
    type: string
  ksu_type:
    description: 'Select KSU Type'
    required: true
    type: string
    default: KSUN
  ksu_branch_or_hash:
    description: 'KSU branch or commit hash (empty = auto-detect by ksu_type)'
    required: false
    type: string
    default: "dev"
  susfs_commit_hash_or_branch:
    description: 'SUSFS branch or commit hash (empty = auto-detect by kernel version)'
    required: false
    type: string
    default: "4003ecf2d01c6d13fa8edf6c4f2607365738dc3d"
  build_timestamp:
    description: 'Custom kernel build timestamp shown in uname -a (e.g. "Tue Feb 10 10:01:02 UTC 2026"). Leave empty to use the current build time.'
    required: false
    type: string
    default: ''
  optimize_level:
    description: 'Compiler optimization level (O2 or O3)'
    required: false
    type: string
    default: O2
  clean:
    description: 'Force clean build without ccache acceleration'
    required: false
    type: boolean
    default: false
  debug:
    description: 'Enable dumping debug related artifacts'
    required: false
    type: boolean
    default: false
  github_token:
    description: 'GitHub Token'
    required: true
  artifact_url:
    description: 'URL of a previous kernel build artifact containing its manifest (e.g., https://github.com/<owner>/<repo>/actions/runs/<run_id>/artifacts/<artifact_id>). If set, the manifest will be extracted from this artifact and used instead of the default one.'
    required: false
    type: string
    default: "https://github.com/docdry0001/EmberHeart_OnePlus11/actions/runs/28755579990/artifacts/8096062679"

outputs:
  kernel_version:
    description: 'Full kernel version string'
    value: ${{ steps.save_metadata.outputs.kernel_version }}
  ksu_version:
    description: 'KernelSU version number'
    value: ${{ steps.save_metadata.outputs.ksu_version }}
  ksu_type:
    description: 'KernelSU Variant'
    value: ${{ steps.save_metadata.outputs.ksu_type }}
  susfs_version:
    description: 'SUSFS version string'
    value: ${{ steps.save_metadata.outputs.susfs_version }}
  build_timestamp:
    description: 'Effective kernel build timestamp used in uname -a'
    value: ${{ steps.save_metadata.outputs.build_timestamp }}
  image_sha256:
    description: 'SHA256 hash of kernel Image'
    value: ${{ steps.collect_stats.outputs.image_sha256 }}
  zip_sha256:
    description: 'SHA256 hash of AnyKernel3 Zip'
    value: ${{ steps.create_zip.outputs.zip_sha256 }}
  warnings:
    description: 'Number of compiler warnings'
    value: ${{ steps.collect_stats.outputs.warnings_count }}
  build_time:
    description: 'Total build time in seconds'
    value: ${{ steps.collect_stats.outputs.build_time }}
  ccache_hit_rate:
    description: 'ccache hit rate percentage'
    value: ${{ steps.ccache_stats.outputs.hit_rate }}
  ccache_direct_rate:
    description: 'ccache direct hit rate percentage'
    value: ${{ steps.ccache_stats.outputs.direct_rate }}
  zip_name:
    description: 'Name of the generated flashable ZIP'
    value: ${{ steps.create_zip.outputs.zip_name }}

runs:
  using: 'composite'
  steps:
    - name: Get Action info
      shell: bash
      env:
        ACTION_REPO_VAL: ${{ github.action_repository }}
        ACTION_REF_VAL: ${{ github.action_ref }}
      run: |
        set -euo pipefail
        echo "ACTION_REPO=$ACTION_REPO_VAL" >> $GITHUB_ENV
        echo "ACTION_REF=$ACTION_REF_VAL" >> $GITHUB_ENV

    - name: 📥 Checkout Code
      uses: actions/checkout@v6
      with:
        repository: ${{ env.ACTION_REPO }}
        ref: ${{ env.ACTION_REF }}
        path: action-source
        fetch-depth: 1

    - name: Parse op_config_json
      shell: bash
      run: |
        set -euo pipefail
        echo '${{ inputs.op_config_json }}' > /tmp/config.json
        jq -r 'to_entries[] | "OP_\(.key | ascii_upcase)=\(.value)"' /tmp/config.json >> "$GITHUB_ENV"
        echo "Parsed config:"
        jq '.' /tmp/config.json

    - name: Validate Inputs
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Validate inputs"
        model="$OP_MODEL"
        soc="$OP_SOC"
        branch="$OP_BRANCH"
        manifest="$OP_MANIFEST"
        android_version="$OP_ANDROID_VERSION"
        kernel_version="$OP_KERNEL_VERSION"
        os_version="$OP_OS_VERSION"
        hmbird="$OP_HMBIRD"
        susfs="$OP_SUSFS"
        bbg="$OP_BBG"
        bbr="$OP_BBR"
        bbr3="$OP_BBR3"
        ttl="$OP_TTL"
        ip_set="$OP_IP_SET"
        rust_build="$OP_RUST_BUILD"
        lto="$OP_LTO"
        uname="$OP_UNAME"
        unicode="$OP_UNICODE"
        c_compiler="$OP_C_COMPILER"
        rust_compiler="$OP_RUST_COMPILER"
        zyc_compiler="$OP_ZYC_COMPILER"
        bindgen="$OP_BINDGEN"
        ds="$OP_DS"
        ntsync="$OP_NTSYNC"
        optimize='${{ inputs.optimize_level }}'
        
        errors=()
        
        if [[ -z "$model" ]]; then
          errors+=("Input 'model' cannot be empty")
        elif [[ ! "$model" =~ ^OP ]]; then
          errors+=("Input 'model' does not start with 'OP'. Got: '$model'")
        fi
        
        if [[ -z "$soc" ]]; then
          errors+=("Input 'soc' cannot be empty")
        elif [[ ! "$soc" =~ ^[A-Za-z0-9_-]+$ ]]; then
          errors+=("Input 'soc' contains invalid characters. Allowed: letters, digits, underscore, dash. Got: '$soc'")
        fi
        
        if [[ -z "$branch" ]]; then
          errors+=("Input 'branch' cannot be empty")
        elif [[ ! "$branch" =~ ^[A-Za-z0-9._/-]+$ ]]; then
          errors+=("Input 'branch' contains invalid characters. Allowed: letters, digits, ., _, -, /. Got: '$branch'")
        fi
        
        if [[ -z "$manifest" ]]; then
          errors+=("Input 'manifest' cannot be empty")
        elif [[ "$manifest" == http*://* ]]; then
          if [[ ! "$manifest" =~ ^https:// ]]; then
            errors+=("Manifest URL must be HTTPS. Got: '$manifest'")
          fi
          if [[ ! "$manifest" =~ \.xml($|\?) ]]; then
            errors+=("Manifest URL should point to an XML file (.xml). Got: '$manifest'")
          fi
        else
          if [[ ! "$manifest" =~ \.xml$ ]]; then
            errors+=("Manifest filename must end with .xml. Got: '$manifest'")
          fi
          if [[ "$manifest" =~ [[:space:]] ]]; then
            errors+=("Manifest filename cannot contain spaces. Got: '$manifest'")
          fi
        fi
        
        if [[ -z "$android_version" ]]; then
          errors+=("Input 'android_version' cannot be empty")
        elif [[ ! "$android_version" =~ ^android[0-9]+$ ]]; then
          errors+=("Input 'android_version' contains invalid characters. Allowed: android followed by a number. Got: '$android_version'")
        fi
        
        if [[ -z "$kernel_version" ]]; then
          errors+=("Input 'kernel_version' cannot be empty")
        elif [[ ! "$kernel_version" =~ ^[0-9]+\.[0-9]+$ ]]; then
          errors+=("Input 'kernel_version' contains invalid characters. Allowed: number in X.Y format. Got: '$kernel_version'")
        fi
        
        if [[ -z "$os_version" ]]; then
          errors+=("Input 'os_version' cannot be empty")
        elif [[ ! "$os_version" =~ ^A ]]; then
          errors+=("Input 'os_version' does not start with 'A'. Got: '$os_version'")
        fi
        
        if [[ -z "$hmbird" ]]; then
          errors+=("Input 'hmbird' cannot be empty")
        elif [[ "$hmbird" != "true" && "$hmbird" != "false" ]]; then
          errors+=("Input 'hmbird' contains invalid characters. Allowed: 'true' or 'false'. Got: '$hmbird'")
        fi
        
        if [[ -z "$susfs" ]]; then
          errors+=("Input 'susfs' cannot be empty")
        elif [[ "$susfs" != "true" && "$susfs" != "false" ]]; then
          errors+=("Input 'susfs' contains invalid characters. Allowed: 'true' or 'false'. Got: '$susfs'")
        fi
        
        if [[ -z "$bbg" ]]; then
          errors+=("Input 'bbg' cannot be empty")
        elif [[ "$bbg" != "true" && "$bbg" != "false" ]]; then
          errors+=("Input 'bbg' contains invalid characters. Allowed: 'true' or 'false'. Got: '$bbg'")
        fi
        
        if [[ -z "$bbr" ]]; then
          errors+=("Input 'bbr' cannot be empty")
        elif [[ "$bbr" != "true" && "$bbr" != "false" ]]; then
          errors+=("Input 'bbr' contains invalid characters. Allowed: 'true' or 'false'. Got: '$bbr'")
        fi
        
        if [[ -z "$bbr3" ]]; then
          errors+=("Input 'bbr3' cannot be empty")
        elif [[ "$bbr3" != "true" && "$bbr3" != "false" ]]; then
          errors+=("Input 'bbr3' contains invalid characters. Allowed: 'true' or 'false'. Got: '$bbr3'")
        fi
        
        if [[ -z "$ttl" ]]; then
          errors+=("Input 'ttl' cannot be empty")
        elif [[ "$ttl" != "true" && "$ttl" != "false" ]]; then
          errors+=("Input 'ttl' contains invalid characters. Allowed: 'true' or 'false'. Got: '$ttl'")
        fi
        
        if [[ -z "$ip_set" ]]; then
          errors+=("Input 'ip_set' cannot be empty")
        elif [[ "$ip_set" != "true" && "$ip_set" != "false" ]]; then
          errors+=("Input 'ip_set' contains invalid characters. Allowed: 'true' or 'false'. Got: '$ip_set'")
        fi
        
        if [[ -z "$rust_build" ]]; then
          errors+=("Input 'rust_build' cannot be empty")
        elif [[ "$rust_build" != "true" && "$rust_build" != "false" ]]; then
          errors+=("Input 'rust_build' contains invalid characters. Allowed: 'true' or 'false'. Got: '$rust_build'")
        fi
        
        if [[ -z "$lto" ]]; then
          errors+=("Input 'lto' cannot be empty")
        elif [[ "$lto" != "none" && "$lto" != "thin" && "$lto" != "full" ]]; then
          errors+=("Input 'lto' contains invalid characters. Allowed: 'thin', 'full' or 'none'. Got: '$lto'")
        fi
        
        if [[ -z "$uname" ]]; then
          errors+=("Input 'uname' cannot be empty")
        elif [[ ${#uname} -gt 44 ]]; then
          errors+=("Input 'uname' too long. Maximum length: 44. Got: '$uname'")
        fi
        
        if [[ -z "$unicode" ]]; then
          errors+=("Input 'unicode' cannot be empty")
        elif [[ "$unicode" != "true" && "$unicode" != "false" ]]; then
          errors+=("Input 'unicode' contains invalid characters. Allowed: 'true' or 'false'. Got: '$unicode'")
        fi
        
        if [[ -z "$ds" ]]; then
          errors+=("Input 'ds' cannot be empty")
        elif [[ "$ds" != "true" && "$ds" != "false" ]]; then
          errors+=("Input 'ds' contains invalid characters. Allowed: 'true' or 'false'. Got: '$ds'")
        fi
        
        if [[ -z "$ntsync" ]]; then
          errors+=("Input 'ntsync' cannot be empty")
        elif [[ "$ntsync" != "true" && "$ntsync" != "false" ]]; then
          errors+=("Input 'ntsync' contains invalid characters. Allowed: 'true' or 'false'. Got: '$ntsync'")
        fi
        
        case "$optimize" in
          O2|O3) ;;
          *) errors+=("optimize_level must be O2 or O3. Got: '$optimize'"); ;;
        esac
        
        if [ ${#errors[@]} -ne 0 ]; then
          echo "Found ${#errors[@]} validation error(s):" >&2
          for error in "${errors[@]}"; do
            echo "  - $error" >&2
          done
          echo "::error::Input validation failed. See logs for details."
          exit 1
        else
          echo "✅ Input validation passed"
        fi
        echo "::endgroup::"

    - name: Setup Base Environment
      shell: bash
      run: |
        set -euo pipefail
        CONFIG="$OP_MODEL"
        echo "Creating folder for configuration: $CONFIG"
        mkdir -p "$CONFIG"
        echo "CONFIG=$CONFIG" >> "$GITHUB_ENV"
        REPO="/usr/local/bin/repo"
        if [ ! -x "$REPO" ]; then
          curl -s https://storage.googleapis.com/git-repo-downloads/repo -o "$REPO"
          chmod +x "$REPO"
        fi
        echo "REPO=$REPO" >> "$GITHUB_ENV"

    - name: Optimize Global Git for Repo Tool
      shell: bash
      run: |
        set -euo pipefail
        git config --global feature.manyFiles true
        git config --global core.fsmonitor true
        git config --global pack.sparse true

    # ---------- ՆՈՐ ՔԱՅԼ ----------
    - name: 📥 Fetch manifest from artifact URL
      id: fetch_manifest
      shell: bash
      if: ${{ inputs.artifact_url != '' }}
      run: |
        set -euo pipefail
        echo "::group::Fetch manifest from artifact"
        ARTIFACT_URL="${{ inputs.artifact_url }}"
        
        if [[ "$ARTIFACT_URL" =~ github\.com/([^/]+)/([^/]+)/actions/runs/([0-9]+)/artifacts/([0-9]+) ]]; then
          OWNER="${BASH_REMATCH[1]}"
          REPO="${BASH_REMATCH[2]}"
          RUN_ID="${BASH_REMATCH[3]}"
          ARTIFACT_ID="${BASH_REMATCH[4]}"
        else
          echo "::error::Invalid artifact URL format: $ARTIFACT_URL"
          exit 1
        fi
        
        echo "Fetching artifact $ARTIFACT_ID from $OWNER/$REPO (run $RUN_ID)..."
        curl -s -L -H "Authorization: Bearer ${{ inputs.github_token }}" \
             -H "Accept: application/vnd.github+json" \
             "https://api.github.com/repos/$OWNER/$REPO/actions/artifacts/$ARTIFACT_ID/zip" \
             -o /tmp/artifact.zip
        
        if [ ! -f /tmp/artifact.zip ]; then
          echo "::error::Failed to download artifact"
          exit 1
        fi
        
        echo "Extracting manifest from artifact..."
        mkdir -p /tmp/artifact_contents
        unzip -q /tmp/artifact.zip -d /tmp/artifact_contents
        
        MANIFEST_PATH=$(find /tmp/artifact_contents -maxdepth 2 -name "manifest*.xml" -o -name "*.xml" | head -n1)
        if [ -z "$MANIFEST_PATH" ]; then
          echo "::error::No manifest XML found in the artifact"
          ls -la /tmp/artifact_contents
          exit 1
        fi
        
        cp "$MANIFEST_PATH" "$GITHUB_WORKSPACE/extracted_manifest.xml"
        echo "✅ Manifest extracted to $GITHUB_WORKSPACE/extracted_manifest.xml"
        echo "MANIFEST=$GITHUB_WORKSPACE/extracted_manifest.xml" >> "$GITHUB_ENV"
        echo "::endgroup::"

    - name: Sync Kernel Source
      id: sync-kernel-source
      uses: ./action-source/.github/actions/kernel-source-sync
      with:
        source_location: ${{ env.CONFIG }}
        github_token: ${{ inputs.github_token }}
        debug: ${{ inputs.debug }}

    - name: Set Dir Paths
      shell: bash
      run: |
        set -euo pipefail
        CONFIG_DIR="$GITHUB_WORKSPACE/$CONFIG"
        ARTIFACTS_DIR="$CONFIG_DIR/artifacts"
        KERNEL_PLATFORM_DIR="$CONFIG_DIR/kernel_platform"
        COMMON_KERNEL_DIR="$KERNEL_PLATFORM_DIR/common"
        MSM_KERNEL_DIR="$KERNEL_PLATFORM_DIR/msm-kernel"
        AK3_DIR="$CONFIG_DIR/AnyKernel3"
        DEBUG_ARTIFACTS_DIR="$GITHUB_WORKSPACE/debug_artifacts"
        KERNEL_PATCHES_DIR="$GITHUB_WORKSPACE/kernel_patches"
        SUSFS_DIR="$GITHUB_WORKSPACE/susfs4ksu"
        KSU_DIR="$KERNEL_PLATFORM_DIR/KernelSU"
        KSUN_DIR="$KERNEL_PLATFORM_DIR/KernelSU-Next"
        mkdir -p "$ARTIFACTS_DIR"
        mkdir -p "$DEBUG_ARTIFACTS_DIR"
        
        echo "CONFIG_FOLDER=$CONFIG_DIR" >> "$GITHUB_ENV"
        echo "ARTIFACTS_FOLDER=$ARTIFACTS_DIR" >> "$GITHUB_ENV"
        echo "KERNEL_PLATFORM_FOLDER=$KERNEL_PLATFORM_DIR" >> "$GITHUB_ENV"
        echo "COMMON_KERNEL_FOLDER=$COMMON_KERNEL_DIR" >> "$GITHUB_ENV"
        echo "MSM_KERNEL_FOLDER=$MSM_KERNEL_DIR" >> "$GITHUB_ENV"
        echo "AK3_FOLDER=$AK3_DIR" >> "$GITHUB_ENV"
        echo "DEBUG_ARTIFACTS_FOLDER=$DEBUG_ARTIFACTS_DIR" >> "$GITHUB_ENV"
        echo "KERNEL_PATCHES_FOLDER=$KERNEL_PATCHES_DIR" >> "$GITHUB_ENV"
        echo "SUSFS_FOLDER=$SUSFS_DIR" >> "$GITHUB_ENV"
        echo "KSU_FOLDER=$KSU_DIR" >> "$GITHUB_ENV"
        echo "KSUN_FOLDER=$KSUN_DIR" >> "$GITHUB_ENV"
        
        DEBUG_ZIP_NAME="debug_${OP_MODEL}_${OP_OS_VERSION}.zip"
        echo "DEBUG_ZIP_NAME=$DEBUG_ZIP_NAME" >> "$GITHUB_ENV"

    # ... (այսուհետև գալիս են ձեր original action-ի մնացած բոլոր քայլերը, 
    # սկսած "Set Kernel build-tools to Path"-ից մինչև վերջ, առանց որևէ փոփոխության)
    # Ձեր հարմարության համար դրանք ամբողջությամբ պատճենված են ստորև:
    
    - name: Set Kernel build-tools to Path
      shell: bash
      run: |
        set -euo pipefail
        echo "${KERNEL_PLATFORM_FOLDER}/prebuilts/kernel-build-tools/linux-x86/bin/" >> $GITHUB_PATH
        echo "${KERNEL_PLATFORM_FOLDER}/prebuilts/kernel-build-tools/linux_musl-x86/bin/" >> $GITHUB_PATH

    - name: Get Kernel Version Info
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Get kernel version"
        cd "$COMMON_KERNEL_FOLDER"
        
        CONFIG_FILES=("build.config.common" "build.config.constants")
        BRANCH_LINE=""
        for f in "${CONFIG_FILES[@]}"; do
          if [ -f "$f" ]; then
            l=$(grep '^[[:space:]]*BRANCH=' "$f" || true)
            if [ -n "$l" ]; then BRANCH_LINE="$l"; break; fi
          fi
        done
        
        if [ -z "$BRANCH_LINE" ]; then
          echo "::error::No BRANCH= found in config files"; exit 1
        fi
        
        BRANCH_VALUE="${BRANCH_LINE#*=}"
        ANDROID_VERSION="${BRANCH_VALUE%-*}"
        
        if [ -z "$ANDROID_VERSION" ]; then
          echo "::error::Could not parse android version from BRANCH=$BRANCH_VALUE"
          exit 1
        fi
        
        VERSION=$(grep '^VERSION *=' Makefile | awk '{print $3}')
        PATCHLEVEL=$(grep '^PATCHLEVEL *=' Makefile | awk '{print $3}')
        SUBLEVEL=$(grep '^SUBLEVEL *=' Makefile | awk '{print $3}')
        FULL_VERSION="$VERSION.$PATCHLEVEL.$SUBLEVEL"
        
        cd "$ARTIFACTS_FOLDER"
        echo "$ANDROID_VERSION-$FULL_VERSION" > "${OP_MODEL}_${OP_OS_VERSION}.txt"
        echo "$OP_OS_VERSION" >> "${OP_MODEL}_${OP_OS_VERSION}.txt"
        
        {
          echo "ANDROID_VER=$ANDROID_VERSION"
          echo "KERNEL_VER=$VERSION.$PATCHLEVEL"
          echo "TKERNEL_VER=$FULL_VERSION"
          echo "KERNEL_FULL_VER=$ANDROID_VERSION-$FULL_VERSION"
          if [ "${{ env.OP_SUSFS }}" = true ]; then
            echo "SUSFS_KERNEL_BRANCH=gki-$ANDROID_VERSION-$VERSION.$PATCHLEVEL"
          fi
        } >> "$GITHUB_ENV"
        
        echo "✅ Detected: $ANDROID_VERSION-$FULL_VERSION"
        if [ "${{ env.OP_SUSFS }}" = true ]; then
          echo "   SUSFS Branch: gki-$ANDROID_VERSION-$VERSION.$PATCHLEVEL"
        fi
        echo "::endgroup::"

    - name: 🏷️ Set Build Identity (Hardcoded)
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Set build user/host"
                
        BUILD_USER="OnePlus"
        BUILD_HOST="ubuntu-build"
        
        echo "BUILD_USER=$BUILD_USER" >> "$GITHUB_ENV"
        echo "BUILD_HOST=$BUILD_HOST" >> "$GITHUB_ENV"
        
        echo ""
        echo "✅ Build identity configured:"
        echo "   User: $BUILD_USER"
        echo "   Host: $BUILD_HOST"
        echo "::endgroup::"

    - name: Check or Detect Clang
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Detect Clang"
        CLANG_FOUND=false
        CLANG_BIN=""
        
        if [ -n "$OP_ZYC_COMPILER" ]; then
          echo "OP_ZYC_COMPILER detected as download link: $OP_ZYC_COMPILER"
          
          ZYC_DIR="$CONFIG_FOLDER/compiler/zyc"
          TEMP_TAR="$CONFIG_FOLDER/compiler.tar.gz"
          mkdir -p "$ZYC_DIR"
          
          echo "Downloading ZyC Clang from link..."
          
          max_retries=5
          attempt=1
          download_success=false
          
          while [ $attempt -le $max_retries ]; do
            echo "Download attempt $attempt/$max_retries..."
            
            if curl -L --fail --retry 3 --retry-delay 5 --connect-timeout 60 -o "$TEMP_TAR" "$OP_ZYC_COMPILER"; then
                echo "Download successful."
                download_success=true
                break
            else
                echo "Download faile

    - name: Add BBG
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Adding BBG"
        cd "$KERNEL_PLATFORM"
        echo "Adding BBG..."
        if ! wget -q -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash -s main; then
          echo "::warning::BBG setup script failed, continuing anyway"
        fi
        cd "$COMMON"
        ./scripts/config --file arch/arm64/configs/gki_defconfig --enable CONFIG_BBG
        sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig
        echo "BBG LSM added ✅"
        echo "::endgroup::"

    - name: Add Oneplus BBR
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Adding Oneplus BBR"
        cd "$COMMON"

        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_TCP_CONG_ADVANCED \
          --enable CONFIG_TCP_CONG_BBR \
          --enable CONFIG_TCP_CONG_BBR3 \
          --enable CONFIG_NET_SCH_FQ \
          --enable CONFIG_NET_SCH_FQ_CODEL

        echo "OnePlus BBR added ✅"
        echo "::endgroup::"

    - name: Add my kernel patches to common kernel
      if: env.SOC == 'waipio' && inputs.use_opt_patches == 'true'
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Applying my patches from my repo..."
        cd "$COMMON"

        for patch_file in $KERNEL_PATCHES/kernel_patches/op11/common/*.patch; do
            echo "Applying patch: $patch_file"
            patch -p1 < "$patch_file"
        done

        echo "My kernel patches applied ❤️‍🔥"
        echo "::endgroup::"

    - name: Add other kernel patches to common kernel
      if: ${{ inputs.use_opt_patches == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Applying patches from wild kernels..."
        cd "$COMMON"

        KERNEL_VERSION="${{ env.KERNEL_VER }}"
        MIN_VERSION="5.16"

        patch -p1 --forward < "$WILD_KERNEL_PATCHES/common/optimized_mem_operations.patch"
        patch -p1 --forward < "$WILD_KERNEL_PATCHES/common/file_struct_8bytes_align.patch"
        patch -p1 --forward < "$WILD_KERNEL_PATCHES/common/reduce_cache_pressure.patch"

        patch -p1 --forward < "$WILD_KERNEL_PATCHES/common/mem_opt_prefetch.patch"

        if [ "$(printf '%s\n' "$KERNEL_VERSION" "$MIN_VERSION" | sort -V | tail -n1)" = "$KERNEL_VERSION" ]; then
          patch -p1 --forward < "$WILD_KERNEL_PATCHES/common/optimise_memcmp.patch"
        elif [ "$(printf '%s\n' "$KERNEL_VERSION" "5.11" | sort -V | tail -n1)" = "$KERNEL_VERSION" ]; then
          sed -e 's/SYM_FUNC_START(__pi_memcmp)/SYM_FUNC_START_WEAK_PI(memcmp)/' -e 's/SYM_FUNC_END(__pi_memcmp)/SYM_FUNC_END_PI(memcmp)/' -e 's/SYM_FUNC_ALIAS_WEAK(memcmp, __pi_memcmp)/EXPORT_SYMBOL_NOKASAN(memcmp)/' "$WILD_KERNEL_PATCHES/common/optimise_memcmp.patch" | patch -p1 --forward
        else
          echo "Optimised memcmp patch not found!"
        fi

        patch -p1 --forward < "$WILD_KERNEL_PATCHES/common/minimise_wakeup_time.patch"
        patch -p1 --forward < "$WILD_KERNEL_PATCHES/common/int_sqrt.patch"
        patch -p1 --forward < "$WILD_KERNEL_PATCHES/common/force_tcp_nodelay.patch"
        patch -p1 --forward < "$WILD_KERNEL_PATCHES/common/reduce_gc_thread_sleep_time.patch"
        patch -p1 --forward < "$WILD_KERNEL_PATCHES/common/add_timeout_wakelocks_globally.patch"
        patch -p1 --forward < "$WILD_KERNEL_PATCHES/common/f2fs_reduce_congestion.patch"
        patch -p1 --forward < "$WILD_KERNEL_PATCHES/common/reduce_freeze_timeout.patch"

        if [ "$(printf '%s\n' "$KERNEL_VERSION" "$MIN_VERSION" | sort -V | head -n1)" = "$KERNEL_VERSION" ]; then
          patch -p1 --forward < "$WILD_KERNEL_PATCHES/common/clear_page_16bytes_align.patch"
        else
          cat "$WILD_KERNEL_PATCHES/common/clear_page_16bytes_align.patch" | sed -e 's/SYM_FUNC_START_PI(clear_page)/SYM_FUNC_START_PI(__pi_clear_page)/' | patch -p1 -F3 --forward
        fi

        patch -p1 -F3 --forward < "$WILD_KERNEL_PATCHES/common/add_limitation_scaling_min_freq.patch"
        patch -p1 -F3 --forward < "$WILD_KERNEL_PATCHES/common/re_write_limitation_scaling_min_freq.patch"
        patch -p1 -F3 --forward < "$WILD_KERNEL_PATCHES/common/adjust_cpu_scan_order.patch"
        patch -p1 -F3 --forward < "$WILD_KERNEL_PATCHES/common/avoid_extra_s2idle_wake_attempts.patch"
        patch -p1 -F3 --forward < "$WILD_KERNEL_PATCHES/common/disable_cache_hot_buddy.patch"
        patch -p1 -F3 --forward < "$WILD_KERNEL_PATCHES/common/f2fs_enlarge_min_fsync_blocks.patch"
        patch -p1 -F3 --forward < "$WILD_KERNEL_PATCHES/common/increase_ext4_default_commit_age.patch"
        patch -p1 -F3 --forward < "$WILD_KERNEL_PATCHES/common/increase_sk_mem_packets.patch"
        patch -p1 -F3 --forward < "$WILD_KERNEL_PATCHES/common/reduce_pci_pme_wakeups.patch"
        patch -p1 -F3 --forward < "$WILD_KERNEL_PATCHES/common/silence_irq_cpu_logspam.patch"
        patch -p1 -F3 --forward < "$WILD_KERNEL_PATCHES/common/silence_system_logspam.patch"
        patch -p1 -F3 --forward < "$WILD_KERNEL_PATCHES/common/use_unlikely_wrap_cpufreq.patch"

        echo "Other kernel patches applied 🔥"
        echo "::endgroup::"

    - name: Add Nethunter inline configs
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Applying Nethunter configs..."
        cd "$COMMON"

        # Bluetooth configs
        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_BT_HCIBTUSB \
          --enable CONFIG_BT_HCIBTUSB_BCM \
          --enable CONFIG_BT_HCIBTUSB_RTL \
          --enable CONFIG_BT_HCIVHCI \
          --enable CONFIG_BT_HCIBCM203X \
          --enable CONFIG_BT_HCIBPA10X \
          --enable CONFIG_BT_HCIBFUSB

        # Airspy & HackRF
        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_USB_AIRSPY \
          --enable CONFIG_USB_HACKRF

        # CAN
        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_CAN \
          --enable CONFIG_CAN_DEV \
          --enable CONFIG_CAN_CALC_BITTIMING \
          --enable CONFIG_CAN_LEDS \
          --enable CONFIG_CAN_VCAN \
          --enable CONFIG_CAN_GRCAN \
          --enable CONFIG_CAN_XILINXCAN

        # Bosch C_CAN/D_CAN devices
        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_CAN_C_CAN \
          --enable CONFIG_CAN_C_CAN_PLATFORM \
          --enable CONFIG_CAN_C_CAN_PCI

        # Bosch CC770 and Intel AN82527 devices
        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_CAN_CC770 \
          --enable CONFIG_CAN_CC770_ISA \
          --enable CONFIG_CAN_CC770_PLATFORM

        # Bosch M_CAN devices
        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_CAN_M_CAN \
          --enable CONFIG_CAN_M_CAN_PCI \
          --enable CONFIG_CAN_M_CAN_PLATFORM \
          --enable CONFIG_CAN_M_CAN_TCAN4X5X

        # CAN SPI interfaces
        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_CAN_HI311X \
          --enable CONFIG_CAN_MCP251X

        # CAN USB interfaces
        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_CAN_8DEV_USB \
          --enable CONFIG_CAN_EMS_USB \
          --enable CONFIG_CAN_ESD_USB2 \
          --enable CONFIG_CAN_GS_USB \
          --enable CONFIG_CAN_KVASER_USB \
          --enable CONFIG_CAN_PEAK_USB

        # CAN - Networking
        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_NETLINK_DIAG \
          --enable CONFIG_VSOCKETS \
          --enable CONFIG_NET_SCHED \
          --enable CONFIG_NET_EMATCH_CANID

        # USB Serial Converter
        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_USB_SERIAL \
          --enable CONFIG_USB_SERIAL_CONSOLE \
          --enable CONFIG_USB_SERIAL_GENERIC \
          --enable CONFIG_USB_SERIAL_CH341 \
          --enable CONFIG_USB_SERIAL_FTDI_SIO \
          --enable CONFIG_USB_SERIAL_PL2303

        echo "Nethunter configs applied ✅"
        echo "::endgroup::"

    - name: Add Other configs
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Adding other configs..."
        cd "$COMMON"

        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_LRU_GEN_ENABLED

        # Add for Droidspaces support
        echo "Applying patch to enable SYSVIPC without breaking ABI"
        case "$BRANCH" in
          oneplus/sm8850|oneplus/sm8845)
            if patch -R -p1 -s -f --dry-run < "$WILD_KERNEL_PATCHES/common/droidspaces/fix_sysvipc_kabi_a16-6.12.patch" >/dev/null 2>&1; then
              echo "[INFO] Patch already applied. Skipping."
            else
              patch -p1 --forward < "$WILD_KERNEL_PATCHES/common/droidspaces/fix_sysvipc_kabi_a16-6.12.patch"
            fi
            ;;
          oneplus/sm8550|oneplus/sm7550)
            if patch -R -p1 -s -f --dry-run < "$WILD_KERNEL_PATCHES/common/droidspaces/fix_sysvipc_kabi_1_2_3.patch" >/dev/null 2>&1; then
              echo "[INFO] Patch already applied. Skipping."
            else
              patch -p1 --forward < "$WILD_KERNEL_PATCHES/common/droidspaces/fix_sysvipc_kabi_1_2_3.patch"
            fi
            ;;
          oneplus/sm8450|oneplus/sm8475|oneplus/mt6895|oneplus/mt6983|oneplus/mt6789)
            if [ "$ANDROID_RELEASE" = "android12" ] && [ "$KERNEL_VER" = "5.10" ]; then
              if patch -R -p1 -s -f --dry-run < "$WILD_KERNEL_PATCHES/common/droidspaces/fix_sysvipc_kabi_bypass_a16-6.12_below.patch" >/dev/null 2>&1; then
                echo "[INFO] Patch already applied. Skipping."
              else
                patch -p1 --forward < "$WILD_KERNEL_PATCHES/common/droidspaces/fix_sysvipc_kabi_bypass_a16-6.12_below.patch"
              fi

              if patch -R -p1 -s -f --dry-run < "$WILD_KERNEL_PATCHES/common/droidspaces/fix_abi_padding_for_posix_mqueue.patch" >/dev/null 2>&1; then
                echo "[INFO] Patch already applied. Skipping."
              else
                patch -p1 --forward < "$WILD_KERNEL_PATCHES/common/droidspaces/fix_abi_padding_for_posix_mqueue.patch"
              fi
            else

              if patch -R -p1 -s -f --dry-run < "$WILD_KERNEL_PATCHES/common/droidspaces/fix_sysvipc_kabi_6_7_8.patch" >/dev/null 2>&1; then
                echo "[INFO] Patch already applied. Skipping."
              else
                patch -p1 --forward < "$WILD_KERNEL_PATCHES/common/droidspaces/fix_sysvipc_kabi_6_7_8.patch"
              fi

            fi
            ;;
          los/sm8550)
            if patch -R -p1 -s -f --dry-run < "$WILD_KERNEL_PATCHES/common/droidspaces/fix_sysvipc_kabi_3_4_5.patch" >/dev/null 2>&1; then
                echo "[INFO] Patch already applied. Skipping."
            else
                patch -p1 --forward < "$WILD_KERNEL_PATCHES/common/droidspaces/fix_sysvipc_kabi_3_4_5.patch"
            fi
            ;;
          *)
            if patch -R -p1 -s -f --dry-run < "$WILD_KERNEL_PATCHES/common/droidspaces/fix_sysvipc_kabi_6_7_8.patch" >/dev/null 2>&1; then
              echo "[INFO] Patch already applied. Skipping."
            else
              patch -p1 --forward < "$WILD_KERNEL_PATCHES/common/droidspaces/fix_sysvipc_kabi_6_7_8.patch"
            fi
            ;;
        esac

        ./scripts/config --file arch/arm64/configs/gki_defconfig \
                  --enable CONFIG_SYSVIPC \
                  --enable CONFIG_DEVTMPFS \
                  --enable CONFIG_PID_NS \
                  --enable CONFIG_POSIX_MQUEUE \
                  --enable CONFIG_NETFILTER_XT_MATCH_ADDRTYPE \
                  --enable CONFIG_NETFILTER_XT_SET \
                  --enable CONFIG_NETFILTER_XT_TARGET_REJECT \
                  --enable CONFIG_NETFILTER_XT_TARGET_LOG \
                  --enable CONFIG_NETFILTER_XT_MATCH_RECENT

        echo "Other configs added ✅"
        echo "::endgroup::"

    - name: Add TTL Target Support
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Adding TTL support..."
        cd "$COMMON"

        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_IP_NF_TARGET_TTL \
          --enable CONFIG_IP6_NF_TARGET_HL \
          --enable CONFIG_IP6_NF_MATCH_HL

