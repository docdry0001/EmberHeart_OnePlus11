        echo "::endgroup::"

    - name: Add IP SET Support
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Adding IP SET support..."
        cd "$COMMON"

        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_IP_SET \
          --set-val CONFIG_IP_SET_MAX 65534 \
          --enable CONFIG_IP_SET_BITMAP_IP \
          --enable CONFIG_IP_SET_BITMAP_IPMAC \
          --enable CONFIG_IP_SET_BITMAP_PORT \
          --enable CONFIG_IP_SET_HASH_IP \
          --enable CONFIG_IP_SET_HASH_IPMARK \
          --enable CONFIG_IP_SET_HASH_IPPORT \
          --enable CONFIG_IP_SET_HASH_IPPORTIP \
          --enable CONFIG_IP_SET_HASH_IPPORTNET \
          --enable CONFIG_IP_SET_HASH_IPMAC \
          --enable CONFIG_IP_SET_HASH_MAC \
          --enable CONFIG_IP_SET_HASH_NETPORTNET \
          --enable CONFIG_IP_SET_HASH_NET \
          --enable CONFIG_IP_SET_HASH_NETNET \
          --enable CONFIG_IP_SET_HASH_NETPORT \
          --enable CONFIG_IP_SET_HASH_NETIFACE \
          --enable CONFIG_IP_SET_LIST_SET

        echo "IP  SET support added ✅"
        echo "::endgroup::"

    - name: Add Build based configs
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Applying build based configs..."
        cd "$COMMON"

        if [ "${{ inputs.lto }}" = "Thin" ]; then
          ./scripts/config --file arch/arm64/configs/gki_defconfig \
            --enable CONFIG_LTO_CLANG_THIN \
            --enable CONFIG_LTO_CLANG
        else
          ./scripts/config --file arch/arm64/configs/gki_defconfig \
            --enable CONFIG_LTO_CLANG_FULL \
            --enable CONFIG_LTO_CLANG
        fi

        # Optimize level config and flags
        if [ "${{ inputs.optimize_level }}" = "O3" ]; then
          ./scripts/config --file arch/arm64/configs/gki_defconfig \
            --disable CC_OPTIMIZE_FOR_PERFORMANCE \
            --enable CC_OPTIMIZE_FOR_PERFORMANCE_O3
        else
          ./scripts/config --file arch/arm64/configs/gki_defconfig \
           --enable CC_OPTIMIZE_FOR_PERFORMANCE \
           --disable CC_OPTIMIZE_FOR_PERFORMANCE_O3
        fi
        echo "Build configs applied ✅"
        echo "::endgroup::"

    - name: Customize Kernel Branding
      shell: bash
      env:
        INPUT_UNAME: ${{ inputs.kernel_uname }}
      run: |
        set -euo pipefail
        echo "::group::Applying Kernel Branding..."
        cd "$COMMON"
        if [ -n "$INPUT_UNAME" ]; then
          CUSTOM_LOCALVERSION="-${ANDROID_RELEASE}-${{ inputs.kernel_uname }}"
          echo "CUSTOM_LOCALVERSION=$CUSTOM_LOCALVERSION" >> "$GITHUB_ENV"
          echo "[INFO] Using kernel version: ${KERNEL_FULL_VER}${CUSTOM_LOCALVERSION}"
        else
          SCM=$(./scripts/setlocalversion 2>/dev/null || echo "-g$(git rev-parse --short HEAD)") || echo "ERROR"
          echo "[INFO] Using default kernel version: ${KERNEL_FULL_VER}${SCM}"
        fi

        echo "Kernel branding applied ✅"
        echo "::endgroup::"

    - name: Build Kernel
      shell: bash
      env:
        PYTHONWARNINGS: "ignore:invalid escape sequence"
      run: |
        set -euo pipefail
        echo "::group::Build kernel"
        cd "$COMMON"

        # Ensure Python warnings are suppressed for scripts invoked by make
        export PYTHONWARNINGS="${PYTHONWARNINGS}"

        if [ -d "$KERNEL_PLATFORM/build/build-tools/path" ]; then
          export PATH="$KERNEL_PLATFORM/build/build-tools/path/linux-x86:$PATH"
        else
          export PATH="$KERNEL_PLATFORM/prebuilts/kernel-build-tools/linux-x86/bin:$PATH"
        fi

        if [ "${{ inputs.lto }}" = "Thin" ]; then 
          echo '#!/bin/bash' > ld-wrapper
          echo 'ld.lld "$@" --thinlto-cache-dir=$LDCACHE_DIR --thinlto-jobs=$(nproc --all)' >> ld-wrapper
          chmod +x ld-wrapper
          LD="$(pwd)/ld-wrapper"
        else
          LD="ld.lld"
        fi

        if [ -d "$KERNEL_PLATFORM/build/build-tools/path" ]; then
          DTC="$KERNEL_PLATFORM/build/kernel/build-tools/path/linux-x86/dtc"
        else
          DTC="$KERNEL_PLATFORM/prebuilts/kernel-build-tools/linux-x86/bin/dtc"
        fi

        MAKE_FLAGS+=(
          LLVM=1
          LLVM_IAS=1
          ARCH=arm64
          CROSS_COMPILE="aarch64-linux-gnu-"
          LD="${LD}"
          DTC="${DTC}"
          DTC_FLAGS="-@"
          HOSTCC="ccache clang"
          HOSTCXX="ccache clang++"
          CC="ccache clang"
        )

        OUT=out
        INSTALL_MOD_PATH="$COMMON/out"
        mkdir -p "$OUT"

        CONFIGS=(
            "gki_defconfig"
        )

        if [[ "$BUILD_TYPE" == "Monolithic Build" ]]; then
          # Merge defconfig fragments

          if [ -f "arch/arm64/configs/vendor/${SOC}_GKI.config" ]; then
            CONFIGS+=("vendor/${SOC}_GKI.config")
          fi

          if [ -f "arch/arm64/configs/vendor/oplus/${SOC}_GKI.config" ]; then
            CONFIGS+=("vendor/oplus/${SOC}_GKI.config")
          fi

          if [ -f "arch/arm64/configs/vendor/debugfs.config" ]; then
            CONFIGS+=("vendor/debugfs.config")
          fi
        fi

        make "${MAKE_FLAGS[@]}" O="$OUT" "${CONFIGS[@]}"

        # LOCALVERSION branding
        if [ -n "${CUSTOM_LOCALVERSION:-}" ]; then
          : > "$COMMON/.scmversion"
          ./scripts/config --file "$OUT/.config" \
            --set-str LOCALVERSION "${CUSTOM_LOCALVERSION}" \
            --disable LOCALVERSION_AUTO
          sed -i 's/scm_version="$(scm_version --short)"/scm_version=""/' scripts/setlocalversion
          echo "[INFO] Custom branding applied to config"
        else
          ./scripts/config --file "$OUT/.config" \
            --enable LOCALVERSION_AUTO
        fi

        echo "kernel_release=$(make "${MAKE_FLAGS[@]}" O="$OUT" -s kernelrelease)" >> "$GITHUB_ENV"

        echo "Starting build with $(nproc --all) threads..."
        SECONDS=0

        make "${MAKE_FLAGS[@]}" O="$OUT" olddefconfig

        if [[ "$BUILD_TYPE" == "Mixed Build" || "$BUILD_TYPE" == "Modules Only" ]]; then
          make -j$(nproc --all) "${MAKE_FLAGS[@]}"  O="$OUT" Image modules
          make -j$(nproc --all) "${MAKE_FLAGS[@]}" O="$OUT" INSTALL_MOD_STRIP=1 INSTALL_MOD_PATH="$INSTALL_MOD_PATH" modules_install
        else
          make -j$(nproc --all) "${MAKE_FLAGS[@]}"  O="$OUT" Image
        fi
        

        echo "duration=$SECONDS" >> "$GITHUB_ENV"

        IMG="$OUT/arch/arm64/boot/Image"
        if [ ! -f "$IMG" ]; then
          echo "Kernel Image missing"
          exit 1
        fi
        sha256sum "$IMG" | tee "$OUT/Image.sha256"
        echo "Kernel built 😆"

        cp "$OUT/System.map" "$ARTIFACTS_DIR_DEBUG"

        if [[ "$BUILD_TYPE" == "Mixed Build" || "$BUILD_TYPE" == "Modules Only" ]]; then
          cp "$OUT/Module.symvers" "$ARTIFACTS_DIR_DEBUG"
        fi

        cp "$OUT/vmlinux" "$ARTIFACTS_DIR_DEBUG"

        echo "::endgroup::"

    - name: Copy Files for Mixed builds
      if: ${{ env.BUILD_TYPE == 'Mixed Build' || env.BUILD_TYPE == 'Kernel Only' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group:: Copying files for mixed build"
        OUT="$COMMON/out"

        cp "$OUT/arch/arm64/boot/Image" "$KBUILD_MIXED_TREE_DIR"
        cp "$OUT/vmlinux" "$KBUILD_MIXED_TREE_DIR"
        cp "$OUT/System.map" "$KBUILD_MIXED_TREE_DIR"
        cp "$OUT/vmlinux.symvers" "$KBUILD_MIXED_TREE_DIR"
        cp "$OUT/modules.builtin" "$KBUILD_MIXED_TREE_DIR"
        cp "$OUT/modules.builtin.modinfo" "$KBUILD_MIXED_TREE_DIR"

        echo "[DEBUG] KBUILD_MIXED_TREE_DIR contents: $(ls ${KBUILD_MIXED_TREE_DIR})"
        echo "::endgroup::"

    - name: Collect Build Stats / Validate Image
      id: collect_kernel_stats
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Collecting Build Stats..."
        OUT="$COMMON/out"
        IMG="$OUT/arch/arm64/boot/Image"

        echo "[DEBUG] Kernel build completed in ${duration}s"

        WARNINGS=$(grep -i -E 'warning:' "$COMMON/build.log" | wc -l || true)
        echo "$WARNINGS" > "$OUT/warnings.txt"

        if [ -f "$IMG" ]; then
          file "$IMG" > "$OUT/Image.file" || true
          KERNEL_UNAME=$(strings "$IMG" | grep -E 'Linux version.*#' | tail -n1 || true)
          echo "Kernel Uname: ${KERNEL_UNAME:-unknown}"
          echo "KERNEL_UNAME=${KERNEL_UNAME:-unknown}" >> "$GITHUB_ENV"

          if ! file "$IMG" | grep -qi 'ARM64'; then
            echo "WARNING: Image does not appear to be ARM64:"
            file "$IMG" || true
          fi

          MIN_SIZE=$((6*1024*1024))
          ACTUAL_SIZE=$(stat -c %s "$IMG" || echo 0)
          if [ "$ACTUAL_SIZE" -lt "$MIN_SIZE" ]; then
            echo "WARNING: Image size $ACTUAL_SIZE < $MIN_SIZE (suspicious)."
          fi

          CALC_SHA=$(sha256sum "$IMG" | cut -d' ' -f1)
          if [ -f "$OUT/Image.sha256" ]; then
            REC_SHA=$(cut -d' ' -f1 "$OUT/Image.sha256" | tr -d '\n')
            if [ "$CALC_SHA" != "$REC_SHA" ]; then
              echo "WARNING: Image.sha256 mismatch. recorded=$REC_SHA calculated=$CALC_SHA"
            fi
            IMAGE_SHA256="$REC_SHA"
          else
            echo "WARNING: Image.sha256 not found, using calculated sha256."
            IMAGE_SHA256="$CALC_SHA"
          fi
        else
          echo "WARNING: Image file not found at $IMG"
          IMAGE_SHA256=""
          KERNEL_UNAME="unknown"
          echo "KERNEL_UNAME=unknown" >> "$GITHUB_ENV"
        fi

        echo "Image sha256: ${IMAGE_SHA256:-none}"
        echo "warnings=$WARNINGS" >> "$GITHUB_OUTPUT"
        echo "image_sha256=${IMAGE_SHA256:-}" >> "$GITHUB_OUTPUT"

        echo "Build stats collected ✅"
        echo "::endgroup::"

    - name: Create Kernel ZIP
      id: create_zip
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Creating AK3 zip..."
        IMAGE_PATH="$COMMON/out/arch/arm64/boot/Image"
        if [ ! -f "$IMAGE_PATH" ]; then
          echo "ERROR: Built Image not found"
          exit 1
        fi

        # Put Image into AnyKernel3
        cp "$IMAGE_PATH" "$GITHUB_WORKSPACE/AnyKernel3/Image"
        cd "$GITHUB_WORKSPACE/AnyKernel3"

        if [ "${{ inputs.use_susfs }}" = "true" ]; then
          ZIP_NAME="AnyKernel3_${MODEL}_${{ inputs.optimize_level }}_${{ env.KERNEL_FULL_VER }}_Next_${KSUVER}_SuSFS_${SUSVER}.zip"
        else
          ZIP_NAME="AnyKernel3_${MODEL}_${{ inputs.optimize_level }}_${{ env.KERNEL_FULL_VER }}_Next_${KSUVER}.zip"
        fi

        echo "Creating flashable zip: $ZIP_NAME"
        ( cd "$GITHUB_WORKSPACE/AnyKernel3" && zip -r "$ARTIFACTS_DIR/$ZIP_NAME" ./* >/dev/null )

        # Keep only the flashable zip and the model metadata file (assumed already created earlier)
        find "$ARTIFACTS_DIR" -maxdepth 1 -type f ! -name "$ZIP_NAME" ! -name "${MODEL}.txt" -delete

        # Output for later steps (optional)
        echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

        echo "AnyKernel3 zip created ✅"
        echo "::endgroup::"

    - name: Create Boot Image
      if: success() && steps.create_zip.conclusion == 'success'
      id: create_boot
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Creating boot image..."
        OUT="$COMMON/out"
        IMAGE="$OUT/arch/arm64/boot/Image"
        MKBOOTIMG="$KERNEL_PLATFORM/tools/mkbootimg/mkbootimg.py"

        if [ -d "$KERNEL_PLATFORM/build/build-tools/path" ]; then
          export PATH="$KERNEL_PLATFORM/build/build-tools/path/linux-x86:$PATH"
        else
          export PATH="$KERNEL_PLATFORM/prebuilts/kernel-build-tools/linux-x86/bin:$PATH"
        fi

        MKBOOTIMG_ARGS=(
          "--header_version" "4"
          "--os_version" "13.0.0"
          "--os_patch_level" "2099-12-01"
          "--pagesize" "4096"
          "--kernel" "$IMAGE"
          "--output" "$OUT/boot.img"
        )

        echo "Creating boot image"
        "$MKBOOTIMG" "${MKBOOTIMG_ARGS[@]}"

        echo "Signing boot image"

        avbtool add_hash_footer \
          --partition_name boot \
          --partition_size "$BOOT_PARTITION_SIZE" \
          --image "$OUT/boot.img" \
          --algorithm "SHA256_RSA4096" \
          --key "$KERNEL_PLATFORM/tools/mkbootimg/gki/testdata/testkey_rsa4096.pem"

        cp "$OUT/boot.img" "$ARTIFACTS_DIR"
        BOOT_SHA256=$(sha256sum "$OUT/boot.img" | cut -d' ' -f1)
        echo "boot_sha256=${BOOT_SHA256:-ERROR}" >> "$GITHUB_OUTPUT"

        echo "Boot image created ✅"
        echo "::endgroup::"

    - name: Create system_dlkm Image
      if: ${{ inputs.compile_dlkm == 'true'  && env.BUILD_TYPE != 'Monolithic Build' }}
      id: create_system_dlkm
      shell: bash
      run: |
        PREBUILTS="https://raw.githubusercontent.com/nullptr-t-oss/kernel_patches/refs/heads/main/prebuilts/$MODEL"
        OUT="$COMMON/out"
        UNAME=$(ls "$OUT/lib/modules/")
        DLKM_STAGING_DIR="$OUT/system_dlkm_staging"
        DLKM_STAGING_ROOT="$DLKM_STAGING_DIR/lib/modules/$UNAME"

        if [ -d "$KERNEL_PLATFORM/build/build-tools/path" ]; then
          export PATH="$KERNEL_PLATFORM/build/build-tools/path/linux-x86:$PATH"
        else
          export PATH="$KERNEL_PLATFORM/prebuilts/kernel-build-tools/linux-x86/bin:$PATH"
        fi

        # Don't create DLKM_STAGING_DIR and copy the OUT/lib folder cause it has many unnecessary files
        # Instead create lib and copy modules folder from OUT/lib/modules to DLKM_STAGING_DIR/lib/
        mkdir -p "$DLKM_STAGING_DIR/lib"
        
        # copy modules and other files generated by depmod to staging dir
        cp -a "$OUT/lib/modules" "$DLKM_STAGING_DIR/lib/"
        cp "$DLKM_STAGING_ROOT/modules.order" "$DLKM_STAGING_ROOT/modules.load"
        cp "$DLKM_STAGING_ROOT/modules.load" "$OUT/system_dlkm.modules.load"

        # remove unnecessary files from DLKM_STAGING_ROOT
        cd "$DLKM_STAGING_ROOT"
        rm build source modules.builtin.modinfo

        # add other files found in stock system_dlkm
        cd "$DLKM_STAGING_DIR"
        mkdir -p etc
        cd etc
        curl -sL -o build.prop "$PREBUILTS/system_dlkm/build.prop"
        touch fs_config_dirs fs_config_files

        cd "$OUT"
        # Create temporary prop file for system_dlkm image
        system_dlkm_props_file="$(mktemp)"
        echo -e "system_dlkm_fs_type=ext4\n" >> ${system_dlkm_props_file}
        echo -e "use_dynamic_partition_size=true\n" >> ${system_dlkm_props_file}
        echo -e "ext_mkuserimg=mkuserimg_mke2fs\n" >> ${system_dlkm_props_file}
        echo -e "ext4_share_dup_blocks=true\n" >> ${system_dlkm_props_file}

        build_image "$DLKM_STAGING_DIR" "${system_dlkm_props_file}" "$OUT/system_dlkm.img" /dev/null

        avbtool add_hashtree_footer \
            --partition_name system_dlkm \
            --image "$OUT/system_dlkm.img"

        SYSTEM_DLKM_SHA256=$(sha256sum "$OUT/system_dlkm.img" | cut -d' ' -f1)
        echo "system_dlkm_sha256=${SYSTEM_DLKM_SHA256:-ERROR}" >> "$GITHUB_OUTPUT"

        cp "$OUT/system_dlkm.img" "$ARTIFACTS_DIR"
        cp "$OUT/system_dlkm.modules.load" "$ARTIFACTS_DIR"
        cp "$OUT/system_dlkm.modules.load" "$ARTIFACTS_DIR_DEBUG"

    - name: Format build time
      id: build_time
      shell: bash
      run: |
        set -euo pipefail

        if [ "$duration" -ge 60 ]; then
          duration="$((duration / 60))m $((duration % 60))s"
        else
          duration="${duration}s"
        fi

        echo "duration=$duration" >> "$GITHUB_OUTPUT"

    - name: Final Build Summary
      shell: bash
      run: |
        set -euo pipefail
        {
          echo "### Kernel Build Summary"
          echo "----"
          echo ""
          echo "> [!NOTE]"
          echo "> Model: ${{ env.MODEL }}"
          echo ""
          echo "- Kernel Release: ${{ env.kernel_release }}"
          echo "- Kernel Uname: ${{ env.KERNEL_UNAME }}"
          echo "- KSUN Version: ${KSUVER:-unknown}"
          echo "- KSUN commit SHA: [${{ env.KSUN_COMMIT_SHA }}](https://github.com/KernelSU-Next/KernelSU-Next/commit/${{ env.KSUN_COMMIT_SHA }})"
          echo "- SUSFS Version: ${SUSVER:-unknown}"
          echo "- SUSFS commit SHA: [${{ env.SUSFS_COMMIT_SHA }}](https://gitlab.com/simonpunk/susfs4ksu/-/commit/${{ env.SUSFS_COMMIT_SHA }})"
          echo "- Optimization: ${{ inputs.optimize_level }}"
          echo ""
          echo "> [!IMPORTANT]"
          echo "> - Kernel Image SHA256: ${{ steps.collect_kernel_stats.outputs.image_sha256 }}"
          echo "> - Boot image SHA256: ${{ steps.create_boot.outputs.boot_sha256 }}"
          echo "> - System dlkm image SHA256: ${{ steps.create_system_dlkm.outputs.system_dlkm_sha256 }}"
          echo ""
          echo "> [!NOTE]"
          echo "> Build completed in ${{ steps.build_time.outputs.duration }}"
          echo ""
          echo "> [!IMPORTANT]"
          echo "> ## CCache Statistics :"
          echo "> $(ccache -s -v)"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Cleanup old ccache & upload ccache log
      shell: bash
      run: |
        set -euo pipefail

        echo "[DEBUG] Uploading ccache logs"
        cp "$CCACHE_LOGFILE" "$ARTIFACTS_DIR_DEBUG"

        # Evict untouched ccache contents
        ccache_end=$(date +%s)
        ccache_delta=$(( ccache_end - ccache_start ))
        if [[ "${{ inputs.evict_unused_ccache }}" == "true" ]]; then
          echo "[DEBUG] Deleting ccache contents older than $ccache_delta seconds"
          ccache --evict-older-than "${ccache_delta}s"
        fi

        echo "[WARNING] Deleting old LTO cache..."
        gh cache delete LTO-${{ env.MODEL }}-kernel-${{ inputs.optimize_level }}-${{ env.KERNEL_FULL_VER }} || true

        echo "[WARNING] Deleting old ccache..."
        gh cache delete ccache-${{ env.MODEL }}-kernel-${{ inputs.optimize_level }}-${{ env.KERNEL_FULL_VER }} || true

    - name: Purge old mixed artifacts
      if: ${{ env.BUILD_TYPE == 'Mixed Build' || env.BUILD_TYPE == 'Kernel Only' }}
      shell: bash
      run: |
        gh cache delete ${{ env.MODEL }}-MIXED-TREE-${{ inputs.optimize_level }}-${{ env.KERNEL_FULL_VER }} || true

    - name: Save ccache
      uses: actions/cache/save@v5
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ env.MODEL }}-kernel-${{ inputs.optimize_level }}-${{ env.KERNEL_FULL_VER }}-${{ inputs.lto }}_LTO

    - name: Save LTO cache
      if: ${{ inputs.lto == 'Thin' }}
      uses: actions/cache/save@v5
      with:
        path: ${{ env.LDCACHE_DIR }}
        key: LTO-${{ env.MODEL }}-kernel-${{ inputs.optimize_level }}-${{ env.KERNEL_FULL_VER }}

    - name: Save files for Mixed builds
      if: ${{ env.BUILD_TYPE == 'Mixed Build' || env.BUILD_TYPE == 'Kernel Only' }}
      uses: actions/cache/save@v5
      with:
        path: ${{ env.KBUILD_MIXED_TREE_DIR }}
        key: ${{ env.MODEL }}-MIXED-TREE-${{ inputs.optimize_level }}-${{ env.KERNEL_FULL_VER }}

    - name: Upload Artifacts
      if: success() && steps.create_zip.conclusion == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: kernel-${{ env.MODEL }}
        path: ${{ env.CONFIG }}/artifacts/

    - name: Upload Debug zip
      uses: actions/upload-artifact@v4
      with:
        name: debug-common-${{ env.MODEL }}
        path: ${{ env.CONFIG }}/debug/artifacts/
