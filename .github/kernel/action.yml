          'CPTCFG_ATH11K_DEBUG=y' \
          'CPTCFG_ATH11K_DEBUGFS=y' \
          'CPTCFG_WCN36XX=m' \
          'CPTCFG_WCN36XX_DEBUGFS=y' \
          'CPTCFG_WLAN_VENDOR_ZYDAS=y' \
          'CPTCFG_ZD1211RW=m' \
          'CPTCFG_MHI_BUS=m' \
          'CPTCFG_QRTR=m' \
          'CPTCFG_QRTR_MHI=m' \
          >> .config
        
        make "${MAKE_FLAGS[@]}" \
          KLIB="$KERNEL_BUILD" \
          KLIB_BUILD="$KERNEL_BUILD" \
          olddefconfig </dev/null || true

        # Build
        make -j"$(nproc --all)" "${MAKE_FLAGS[@]}" \
          KLIB="$KERNEL_BUILD" \
          KLIB_BUILD="$KERNEL_BUILD" \
          V=1 2>&1 | tee "$GITHUB_WORKSPACE/backports-build.log"

        KO_COUNT=$(find . -type f -name '*.ko' | wc -l || true)
        echo "KO_COUNT=$KO_COUNT"
        if [ "$KO_COUNT" -eq 0 ]; then
          echo "Backports build failed – no .ko files"
          exit 1
        fi

        mkdir -p ../backports-artifacts
        find . -name '*.ko' -exec cp --parents {} ../backports-artifacts/ \;
        cp .config ../backports-artifacts/backports.config
        cp ../backports-build.log ../backports-artifacts/

    - name: Create Magisk module for backports
      shell: bash
      run: |
        set -euo pipefail
        MODDIR="$GITHUB_WORKSPACE/magisk-mt7921u"
        KO_DIR="$GITHUB_WORKSPACE/backports-artifacts"
        ZIPOUT="$GITHUB_WORKSPACE/$CONFIG/artifacts/mt7921u-backports-magisk.zip"

        rm -rf "$MODDIR"
        mkdir -p "$MODDIR/system/vendor/lib/modules"

        find "$KO_DIR" -type f -name '*.ko' -exec cp {} "$MODDIR/system/vendor/lib/modules/" \;

        cat > "$MODDIR/module.prop" <<'EOF'
        id=mt7921u_backports
        name=MT7921U Backports
        version=1.0
        versionCode=1
        author=yourname
        description=Backports for MT7921U on custom kernel
        EOF

        cat > "$MODDIR/post-fs-data.sh" <<'EOF'
        #!/system/bin/sh
        MODDIR=${0%/*}
        MODPATH="$MODDIR/system/vendor/lib/modules"
        for m in compat cfg80211 mac80211 mt76 mt76-usb mt76-connac-lib mt792x-lib mt792x-usb mt7921-common mt7921u; do
          [ -f "$MODPATH/${m}.ko" ] && insmod "$MODPATH/${m}.ko" 2>/dev/null || true
        done
        EOF
        chmod +x "$MODDIR/post-fs-data.sh"

        cat > "$MODDIR/service.sh" <<'EOF'
        #!/system/bin/sh
        sleep 8
        MODDIR=${0%/*}
        MODPATH="$MODDIR/system/vendor/lib/modules"
        for m in compat cfg80211 mac80211 mt76 mt76-usb mt76-connac-lib mt792x-lib mt792x-usb mt7921-common mt7921u; do
          [ -f "$MODPATH/${m}.ko" ] && insmod "$MODPATH/${m}.ko" 2>/dev/null || true
        done
        EOF
        chmod +x "$MODDIR/service.sh"

        cat > "$MODDIR/customize.sh" <<'EOF'
        #!/system/bin/sh
        ui_print "Installing MT7921U backports module"
        EOF
        chmod +x "$MODDIR/customize.sh"

        cd "$MODDIR"
        zip -r "$ZIPOUT" .
        echo "Magisk module created: $ZIPOUT"

    - name: Create Kernel ZIP
      id: create_zip
      shell: bash
      run: |
        set -euo pipefail
        export SUSVER="${SUSVER:-0}"
        echo "::group::Creating AK3 zip..."
        CONFIG_DIR="$GITHUB_WORKSPACE/$CONFIG"
        IMAGE_PATH="$CONFIG_DIR/kernel_platform/common/out/arch/arm64/boot/Image"
        if [ ! -f "$IMAGE_PATH" ]; then
          echo "ERROR: Built Image not found"
          exit 1
        fi

        cp "$IMAGE_PATH" "$GITHUB_WORKSPACE/AnyKernel3/Image"
        cd "$GITHUB_WORKSPACE/AnyKernel3"

        sed -i '7 c\kernel.string=EmberHeart Kernel by nullptr-t-oss' anykernel.sh
        curl https://raw.githubusercontent.com/nullptr-t-oss/kernel_patches/refs/heads/main/banner > banner

        ZIP_NAME="AnyKernel3_${MODEL}_${{ env.KERNEL_FULL_VER }}_Next_${KSUVER}_SuSFS_${SUSVER}.zip"
        ARTIFACTS_DIR="$CONFIG_DIR/artifacts"
        mkdir -p "$ARTIFACTS_DIR"

        echo "Creating flashable zip: $ZIP_NAME"
        ( cd "$GITHUB_WORKSPACE/AnyKernel3" && zip -r "$ARTIFACTS_DIR/$ZIP_NAME" ./* >/dev/null )

        find "$ARTIFACTS_DIR" -maxdepth 1 -type f ! -name "$ZIP_NAME" ! -name "${MODEL}.txt" -delete

        echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
        echo "AnyKernel3 zip created ✅"
        echo "::endgroup::"

    - name: Create Boot Image
      if: success() && steps.create_zip.conclusion == 'success'
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Creating boot image..."
        CONFIG_DIR="$GITHUB_WORKSPACE/$CONFIG"
        IMAGE="$CONFIG_DIR/kernel_platform/common/out/arch/arm64/boot/Image"

        cd "$GITHUB_WORKSPACE"
        mkdir -p boot
        python3 -m pip install --user gdown
        python3 -m gdown 1DgD6wTSZ-r4zklYzA_x7GYcjwfA9WV0x
        unzip boot.zip
        wget https://github.com/magojohnji/magiskboot-linux/raw/refs/heads/main/x86_64/magiskboot

        BOOT=$(ls | grep -E '*.img')
        MAGISKBOOT="./magiskboot"

        chmod +x $MAGISKBOOT

        echo -n "Unpacking boot image..."
        $MAGISKBOOT unpack $BOOT
        echo -n "Adding kernel to boot image..."
        mv -f $IMAGE kernel
        echo -n "Repacking boot image..."
        $MAGISKBOOT repack $BOOT

        mv -f new-boot.img EmberHeart_boot.img
        cp EmberHeart_boot.img "$CONFIG_DIR/artifacts/"

        echo "Boot image created ✅"
        echo "::endgroup::"

    - name: Final Build Summary
      shell: bash
      run: |
        set -euo pipefail
        {
          echo "Model: ${MODEL}"
          echo "Android: ${{ env.ANDROID_VER }}"
          echo "Kernel base: ${{ env.KERNEL_VER }}"
          echo "Kernel full: ${{ env.KERNEL_FULL_VER }}"
          echo "Kernel Uname: ${{ env.KERNEL_UNAME }}"
          echo "KSUN Version: ${KSUVER:-unknown}"
          echo "KSUN commit SHA: ${{ env.KSUN_COMMIT_SHA }}"
          echo "SUSFS Version: ${SUSVER:-disable}"
          echo "SUSFS commit SHA: ${{ env.SUSFS_COMMIT_SHA }}"
          echo "Optimization: ${{ inputs.optimize_level }}"
          echo "Image SHA256: ${{ steps.collect_stats.outputs.image_sha256 }}"
          echo "Compiler: ${CLANG_VERSION:-unknown}"
          echo ""
          echo "CCache Statistics :"
          echo "$(ccache -s -v)"
        } | tee summary.txt
        {
          echo "### Kernel Build Summary"
          echo ""
          echo "- Model: ${{ env.MODEL }}"
          echo "- Android: ${{ env.ANDROID_VER }}"
          echo "- Kernel Version: ${{ steps.save_metadata.outputs.kernel_version }}"
          echo "- Kernel Uname: ${{ env.KERNEL_UNAME }}"
          echo "- KSUN Version: ${KSUVER:-unknown}"
          echo "- KSUN commit SHA: [${{ env.KSUN_COMMIT_SHA }}](https://github.com/KernelSU-Next/KernelSU-Next/commit/${{ env.KSUN_COMMIT_SHA }})"
          echo "- SUSFS Version: ${SUSVER:-disable}"
          echo "- SUSFS commit SHA: [${{ env.SUSFS_COMMIT_SHA }}](https://gitlab.com/simonpunk/susfs4ksu/-/commit/${{ env.SUSFS_COMMIT_SHA }})"
          echo "- Optimization: ${{ inputs.optimize_level }}"
          echo "- Image SHA256: ${{ steps.collect_stats.outputs.image_sha256 }}"
          echo ""
          echo "CCache Statistics :"
          echo "$(/usr/bin/ccache -s)"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Cleanup old ccache
      shell: bash
      run: |
        set -euo pipefail
        echo "Deleting old ccache..."
        gh cache delete ccache-${{ env.CONFIG }}-kernel-${{ env.KERNEL_FULL_VER }}- || true

    - name: Upload Artifacts
      if: success() && steps.create_zip.conclusion == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: kernel-${{ env.CONFIG }}
        path: |
          ${{ env.CONFIG }}/artifacts/
          ${{ github.workspace }}/backports-artifacts/
          ${{ github.workspace }}/${{ env.CONFIG }}/artifacts/mt7921u-backports-magisk.zip
